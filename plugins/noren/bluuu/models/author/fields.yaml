fields:
    name:
        label: Name
        span: left
        type: text
    slug:
        label: Slug
        span: right
        preset:
            field: name
            type: slug
        type: text
    title:
        label: Title / Role
        span: full
        type: text
        comment: e.g. "Senior Tour Guide · Bluuu Tours"
    bio:
        label: Bio
        span: full
        size: large
        type: textarea
    photo:
        label: Photo
        mode: image
        imageWidth: '150'
        imageHeight: '150'
        useCaption: 0
        thumbOptions:
            mode: crop
            extension: auto
        span: full
        type: fileupload
    avatar:
        label: Avatar URL (fallback)
        span: full
        type: text
        comment: Used only when no photo is uploaded above (https://…)
