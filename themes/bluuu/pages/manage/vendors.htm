<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluuu Vendors</title>
     <link rel="icon" type="image/png" href="https://bluuu.tours/themes/bluuu/assets/favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-6 font-['Outfit']">
<div id="root"></div>
{% verbatim %}
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const TOKEN_KEY = 'bluuu_vendors_token';
const INPUT  = 'bg-white border border-slate-300 text-slate-800 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:border-blue-400';
const SELECT = 'bg-white border border-slate-300 text-slate-800 rounded-lg px-2.5 h-9 text-sm outline-none';

function todayBali() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Makassar' });
}
function shiftDay(ymd, n) {
    const d = new Date(ymd + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDisplayDate(ymd) {
    if (!ymd) return '';
    const [y, m, d] = ymd.split('-');
    return `${d}.${m}.${y}`;
}
function fmtDate(utcStr) {
    if (!utcStr) return null;
    return new Date(utcStr.replace(' ', 'T') + 'Z')
        .toLocaleDateString('en-GB', { timeZone: 'Asia/Makassar', day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtTime(utcStr) {
    if (!utcStr) return null;
    return new Date(utcStr.replace(' ', 'T') + 'Z')
        .toLocaleTimeString('en-GB', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit' });
}
function strVal(v) {
    return v && v !== false ? String(v) : null;
}

// ─── group orders by boat ─────────────────────────────────────────────────────
function groupByBoat(orders) {
    const map = new Map();
    for (const o of orders) {
        const boatName = strVal(o.x_studio_boat_name) || 'Unknown boat';
        if (!map.has(boatName)) map.set(boatName, []);
        map.get(boatName).push(o);
    }
    // sort boats alphabetically
    return Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
}

// ─── BoatCard ─────────────────────────────────────────────────────────────────
function BoatCard({ boatName, orders }) {
    const totalPax = orders.reduce((sum, o) => {
        return sum + (Number(o.x_studio_count_of_people) || (Number(o.x_studio_adults ?? 0) + Number(o.x_studio_kids ?? 0)));
    }, 0);

    const time = fmtTime(orders[0].rental_start_date);

    const guides = [orders[0].x_studio_guide_1_1, orders[0].x_studio_guide_2_1].filter(v => v && v !== false).map(String);

    const tourTypes = [...new Set(orders.map(o => strVal(o.x_studio_tour_type)).filter(Boolean))];

    const allPassengers = orders
        .map(o => strVal(o.x_studio_passenger_list))
        .filter(Boolean)
        .join('\n');

    return (
        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col">
            <div className="px-4 pt-3 pb-2 border-b border-slate-100 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 min-w-0">
                    <span className="text-sm font-bold text-slate-800 truncate">{boatName}</span>
                    {tourTypes.map(t => {
                        const priv = t.toLowerCase().includes('private');
                        return <span key={t} className={`text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-widest shrink-0 ${priv ? 'bg-violet-100 text-violet-600' : 'bg-blue-100 text-blue-600'}`}>{t}</span>;
                    })}
                </div>
                <span className="text-xs text-slate-400 shrink-0">{orders.length} order{orders.length !== 1 ? 's' : ''}</span>
            </div>
            <div className="px-4 py-3 space-y-3 flex-1">
                {time && (
                    <div className="flex items-center gap-2">
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0">Departure</span>
                        <span className="text-slate-800 text-sm font-bold">{time}</span>
                    </div>
                )}
                {guides.length > 0 && (
                    <div className="flex items-center gap-2">
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0">Guides</span>
                        <span className="text-slate-700 text-sm">{guides.join(', ')}</span>
                    </div>
                )}
                <div className="flex items-center gap-2">
                    <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0">Total pax</span>
                    <span className="text-2xl font-bold text-emerald-600">{totalPax}</span>
                </div>
                {allPassengers && (
                    <div>
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest block mb-1">Passengers</span>
                        <div className="bg-slate-50 rounded-xl px-3 py-2 text-sm text-slate-700 whitespace-pre-line leading-relaxed border border-slate-100">
                            {allPassengers}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
}

// ─── LoginScreen ──────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
    const [password, setPassword] = useState('');
    const [loading,  setLoading]  = useState(false);
    const [error,    setError]    = useState('');

    const submit = async e => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
            const res  = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, page: 'vendors' }),
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Wrong password');
            localStorage.setItem(TOKEN_KEY, json.token);
            onLogin(json.token);
        } catch (e) {
            setError(e.message);
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="flex items-center justify-center min-h-screen">
            <div className="bg-white border border-slate-200 rounded-2xl shadow-xl p-8 w-full max-w-xs">
                <h1 className="text-base font-bold text-slate-800 mb-6 uppercase tracking-[0.2em] text-center">Bluuu Vendors</h1>
                <form onSubmit={submit} className="space-y-3">
                    <input type="password" placeholder="Password" value={password}
                        onChange={e => setPassword(e.target.value)}
                        className={INPUT + ' w-full'} autoFocus />
                    {error && <div className="text-xs text-red-500 font-semibold">{error}</div>}
                    <button type="submit" disabled={loading}
                        className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl uppercase tracking-widest text-sm transition-colors disabled:opacity-50">
                        {loading ? '...' : 'Enter'}
                    </button>
                </form>
            </div>
        </div>
    );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
    const [token,      setToken]      = useState(() => localStorage.getItem(TOKEN_KEY) || '');
    const [date,       setDate]       = useState(todayBali);
    const [data,       setData]       = useState(null);
    const [loading,    setLoading]    = useState(false);
    const [error,      setError]      = useState('');
    const [boatFilter, setBoatFilter] = useState('all');

    const load = useCallback(async d => {
        if (!token) return;
        setLoading(true);
        setError('');
        try {
            const res  = await fetch(`/api/admin/leads?date_from=${d}&date_to=${d}`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
            setData(json);
        } catch (e) {
            setError(e.message);
        } finally {
            setLoading(false);
        }
    }, [token]);

    useEffect(() => { load(date); setBoatFilter('all'); }, [date, load]);

    if (!token) return <LoginScreen onLogin={setToken} />;

    const orders = useMemo(() =>
        (data?.orders || []).slice().sort((a, b) => {
            const ta = a.rental_start_date || '';
            const tb = b.rental_start_date || '';
            return ta < tb ? -1 : ta > tb ? 1 : 0;
        })
    , [data]);

    const boatGroups = useMemo(() => groupByBoat(orders), [orders]);

    const visibleGroups = useMemo(() =>
        boatFilter === 'all' ? boatGroups : boatGroups.filter(([name]) => name === boatFilter)
    , [boatGroups, boatFilter]);

    const isToday = date === todayBali();

    return (
        <div>
            {/* Sticky header */}
            <div className="sticky top-0 z-30 bg-slate-100 -mx-4 md:-mx-6 px-4 md:px-6 py-3 flex items-center gap-2 border-b border-slate-200/80 shadow-[0_3px_10px_rgba(0,0,0,0.07)]">
                <span className="text-sm font-bold text-slate-500 uppercase tracking-widest mr-1">Vendors</span>

                {boatGroups.length > 0 && (
                    <select value={boatFilter} onChange={e => setBoatFilter(e.target.value)} className={SELECT}>
                        <option value="all">All boats</option>
                        {boatGroups.map(([name]) => (
                            <option key={name} value={name}>{name}</option>
                        ))}
                    </select>
                )}

                <div className="flex-1" />
                {loading && <span className="text-[10px] text-blue-500 animate-pulse uppercase tracking-widest">Loading…</span>}
                {data && <span className="text-[10px] text-slate-400 uppercase tracking-widest">{boatGroups.length} boats · {orders.length} orders</span>}

                {/* Date nav */}
                <div className="flex items-center gap-1">
                    <button onClick={() => setDate(d => shiftDay(d, -1))}
                        className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 shadow-sm transition-all text-xl font-bold leading-none">
                        ‹
                    </button>
                    <button onClick={() => !isToday && setDate(todayBali())}
                        className={`h-9 px-4 flex items-center border rounded-lg text-sm font-bold shadow-sm transition-all ${isToday ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'}`}>
                        {fmtDisplayDate(date)}
                    </button>
                    <button onClick={() => setDate(d => shiftDay(d, 1))}
                        className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 shadow-sm transition-all text-xl font-bold leading-none">
                        ›
                    </button>
                </div>
                <button onClick={() => load(date)} disabled={loading}
                    className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 shadow-sm transition-all disabled:opacity-40 text-base">
                    ↺
                </button>
            </div>

            {/* Content */}
            <div className="mt-5">
                {error && (
                    <div className="mb-4 rounded-2xl border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-600">{error}</div>
                )}
                {loading && (
                    <div className="flex justify-center mt-16 text-blue-500 font-bold animate-pulse tracking-[0.2em] text-sm">LOADING FROM ODOO...</div>
                )}
                {!loading && data && orders.length === 0 && (
                    <div className="text-center py-16 text-sm text-slate-400">No orders for {fmtDisplayDate(date)}</div>
                )}
                {!loading && visibleGroups.length > 0 && (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        {visibleGroups.map(([boatName, boatOrders]) => (
                            <BoatCard key={boatName} boatName={boatName} orders={boatOrders} />
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endverbatim %}
</body>
</html>
