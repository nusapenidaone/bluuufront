columns:
    id:
        label: id
        type: number
    title:
        label: Title
        type: text
        searchable: true
    author[name]:
        label: Author
        relation: author
        select: name
    slug:
        label: Link
        type: linkage
        attributes:
            target: _blank
        select: concat('/blog/', slug)
    updated_at:
        label: Updated
        type: datetime