    boat_id:
        label: Boat
        type: number
        searchable: true
        sortable: true
        select: amo_name
        relation: boat
    qtty:
        label: Qtty
        type: number
        searchable: true
        sortable: true
    lead_id:
        label: Kommo
        type: number
        searchable: true
        sortable: true
