                            <div className="w-[140px] shrink-0 min-w-0">
                                <div className="text-sm font-semibold text-slate-800 truncate">{partnerName(o)}</div>
                                {o.odoo_phone && (
                                    <div className="text-[11px] text-slate-400 font-mono mt-0.5 truncate">{o.odoo_phone}</div>
                                )}
                            </div>

                            {/* Pax */}
                            <div className="w-[50px] shrink-0 pt-0.5 tabular-nums">
                                <div className="text-sm font-semibold text-slate-800 leading-snug">{adults}<span className="text-[10px] text-slate-400 ml-0.5">ad</span></div>
                                <div className="text-sm font-semibold text-slate-500 leading-snug">{kids}<span className="text-[10px] text-slate-400 ml-0.5">ch</span></div>
                            </div>

                            {/* Lanyard */}
                            <div className="w-[48px] shrink-0 flex items-start pt-1">
                                <LanyardColorPicker
                                    value={o.x_studio_group_lanyard_color && o.x_studio_group_lanyard_color !== false ? String(o.x_studio_group_lanyard_color) : ''}
                                    onChange={v => { const boatDate = odooDateBali(o.rental_start_date); orders.filter(other => other.x_studio_boat_name === o.x_studio_boat_name && odooDateBali(other.rental_start_date) === boatDate).forEach(other => updateOrder(other.id, { x_studio_group_lanyard_color: v })); }}
                                />
                            </div>

                            {/* Boat */}
                            <div className="w-[160px] shrink-0 pt-0.5">
                                <div className={`text-sm font-bold truncate ${priv ? 'text-violet-600' : 'text-blue-600'}`}>
                                    {o.x_studio_boat_name || <span className="text-slate-300">—</span>}
                                </div>
                                <button onClick={e => { e.stopPropagation(); const newStatus = o.x_studio_boat_status === 'Boat Ready' ? 'Not Ready' : 'Boat Ready'; const boatDate = odooDateBali(o.rental_start_date); orders.filter(other => other.x_studio_boat_name === o.x_studio_boat_name && odooDateBali(other.rental_start_date) === boatDate).forEach(other => updateOrder(other.id, { x_studio_boat_status: newStatus })); }}
                                    className={`mt-1 text-[10px] font-bold px-1.5 py-0.5 rounded-md transition-colors ${o.x_studio_boat_status === 'Boat Ready' ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-red-100 text-red-600 hover:bg-red-200'}`}>
                                    {o.x_studio_boat_status === 'Boat Ready' ? '✓ Boat Ready' : '✗ Not Ready'}
                                </button>
                            </div>

                            {/* Tour type + Route */}
                            <div className="w-[130px] shrink-0 pt-0.5">
                                {(() => { const t = tourTypeName(o); return t
                                    ? <div className="text-sm text-slate-600 font-medium truncate">{t}</div>
                                    : null;
                                })()}
                                {o.x_studio_route_new && o.x_studio_route_new !== false && (
                                    <div className="text-[11px] text-slate-400 truncate mt-0.5">{String(o.x_studio_route_new)}</div>
                                )}
                            </div>

                            {/* Guides */}
                            <div className="w-[110px] shrink-0 pt-0.5">
                                {guides.length > 0
                                    ? guides.map((g, i) => <div key={i} className="text-sm text-slate-600 font-medium truncate">{g}</div>)
                                    : <span className="text-slate-300 text-sm">—</span>
                                }
                            </div>

                            {/* Lunch */}
                            <div className="w-[120px] shrink-0 pt-0.5">
                                {rowLunch
                                    ? <div className="text-sm text-slate-600 font-medium truncate">{rowLunch}</div>
                                    : <span className="text-slate-300 text-sm">—</span>
                                }
                            </div>

                            {/* Transfer */}
                            <div className="w-[130px] shrink-0 pt-0.5">
                                {o.x_studio_car_type && o.x_studio_car_type !== false
                                    ? <>
                                        <div className="text-sm text-emerald-700 font-semibold truncate">{String(o.x_studio_car_type)}</div>
                                        {o.x_studio_pickup_address && <div className="text-[10px] text-slate-400 mt-0.5 truncate">{o.x_studio_pickup_address}</div>}
                                      </>
                                    : <span className="text-slate-300 text-sm">—</span>
                                }
                            </div>

                            {/* Special Requests */}
                            <div className="w-[180px] shrink-0 pt-0.5">
                                {o.x_studio_special_requests && o.x_studio_special_requests !== false
                                    ? <div className="text-sm text-slate-600 leading-snug line-clamp-3 whitespace-pre-line">{String(o.x_studio_special_requests)}</div>
                                    : <span className="text-slate-300 text-sm">—</span>
                                }
                            </div>

                            {/* Finance */}
                            <div className="w-[130px] shrink-0 text-right pt-0.5 tabular-nums">
                                <div className="text-sm font-bold text-slate-800">{fmtMoney(o.amount_total)}</div>
                                <div className="text-[10px] text-slate-400 mt-0.5">dep {fmtMoney(o.x_studio_deposit)}</div>
                                {collect > 0 && (
                                    <div className="text-sm font-bold text-amber-500 mt-1">{fmtMoney(o.x_studio_collect)} to collect</div>
                                )}
                                {o.x_studio_payment_source && o.x_studio_payment_source !== false && (
                                    <div className="text-[9px] text-slate-400 uppercase tracking-wider mt-1">{o.x_studio_payment_source}</div>
                                )}
                            </div>

                            {/* Check In + Collect — combined column */}
                            <div className="w-[260px] shrink-0 pt-0.5">
                                {/* Check-in status button */}
                                <button onClick={e => openCheckPay(e, o)}
                                    className={`text-[11px] font-bold px-2 py-1 rounded-lg transition-colors leading-snug ${
                                        o.x_studio_customer_checked_in_and_cleared
                                            ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'
                                            : o.x_studio_no_show_1
                                                ? 'bg-red-600 text-white hover:bg-red-700'
                                                : 'bg-slate-100 text-slate-400 hover:bg-slate-200'
                                    }`}>
                                    {o.x_studio_customer_checked_in_and_cleared ? '✓ Checked In' : o.x_studio_no_show_1 ? '✗ No-Show' : '✗ Not In'}
                                </button>
                                {o.x_studio_checked_in_by && o.x_studio_checked_in_by !== false && (
                                    <div className="text-[10px] text-slate-500 font-medium mt-0.5 px-1">
                                        by {String(o.x_studio_checked_in_by)}
                                    </div>
                                )}
                                {/* Collected amounts — only show if there's something to collect or already collected */}
                                {(collect > 0 || o.x_studio_collected_by_cash > 0 || o.x_studio_collected_by_edcbank > 0) && (
                                    <div className="mt-1.5 space-y-1">
                                        <button onClick={e => openCheckPay(e, o)} className="flex items-center gap-2 w-full group/btn">
                                            <span className="text-[10px] font-bold uppercase tracking-wider bg-slate-100 group-hover/btn:bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded transition-colors shrink-0">Cash</span>
                                            <span className={`text-[12px] font-semibold tabular-nums ${o.x_studio_collected_by_cash > 0 ? 'text-emerald-700' : 'text-slate-300'}`}>
                                                {o.x_studio_collected_by_cash > 0 ? fmtMoney(o.x_studio_collected_by_cash) : '—'}
                                            </span>
                                        </button>
                                        <button onClick={e => openCheckPay(e, o)} className="flex items-center gap-2 w-full group/btn">
                                            <span className="text-[10px] font-bold uppercase tracking-wider bg-slate-100 group-hover/btn:bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded transition-colors shrink-0">EDC</span>
                                            <span className={`text-[12px] font-semibold tabular-nums ${o.x_studio_collected_by_edcbank > 0 ? 'text-emerald-700' : 'text-slate-300'}`}>
                                                {o.x_studio_collected_by_edcbank > 0 ? fmtMoney(o.x_studio_collected_by_edcbank) : '—'}
                                            </span>
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Products */}
                            <div className="w-[220px] shrink-0 pt-0.5">
                                {lines.length === 0 && (
                                    <span className="text-slate-300 text-sm">—</span>
                                )}
                                {lines.length > 0 && lines.map(l => {
                                    const qty = Number(l.product_uom_qty ?? 0);
                                    return (
                                        <div key={l.id} className="flex items-baseline gap-1.5 leading-snug">
                                            <span className="text-[12px] text-slate-700 truncate">{l.name}</span>
                                            <span className="text-[11px] text-slate-400 shrink-0">×{qty}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            })}
            </div>

            {/* ─── Check In + Collect combined popup ─── */}
            {checkPayDialog && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm" onClick={() => setCheckPayDialog(null)}>
                    <div className="bg-white border border-slate-200 rounded-2xl p-6 max-w-sm w-full shadow-2xl" onClick={e => e.stopPropagation()}>

                        {/* Header */}
                        <div className="flex justify-between items-start mb-5">
                            <div>
                                <div className="text-sm font-bold text-slate-800 uppercase tracking-widest">Check In</div>
                                <div className="text-xs text-slate-400 mt-0.5 truncate max-w-[220px]">{checkPayDialog.clientName}</div>
                            </div>
                            <button onClick={() => setCheckPayDialog(null)}
                                className="p-1 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-700 transition-colors text-xl leading-none">×</button>
                        </div>

                        {/* Collect section */}
                        {checkPayDialog.collect > 0 && (
                            <div className="mb-5 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                                <div className="text-[10px] font-bold text-amber-500 uppercase tracking-widest mb-3">
                                    To collect: {fmtMoney(checkPayDialog.collect)}
                                </div>
                                <div className="flex gap-2 mb-3">
                                    <button
                                        onClick={() => setCheckPayDialog(d => ({ ...d, payMethod: 'cash', payAmount: String(d.collect), checkedIn: true }))}
                                        className={`flex-1 py-2 rounded-xl text-sm font-bold border transition-colors ${
                                            checkPayDialog.payMethod === 'cash'
                                                ? 'bg-slate-800 border-slate-700 text-white'
                                                : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300'
                                        }`}>
                                        Cash
                                    </button>
                                    <button
                                        onClick={() => setCheckPayDialog(d => ({ ...d, payMethod: 'edc', payAmount: String(d.collect), checkedIn: true }))}
                                        className={`flex-1 py-2 rounded-xl text-sm font-bold border transition-colors ${
                                            checkPayDialog.payMethod === 'edc'
                                                ? 'bg-slate-800 border-slate-700 text-white'
                                                : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300'
                                        }`}>
                                        EDC
                                    </button>
                                </div>
                                {checkPayDialog.payMethod && (
                                    <input
                                        type="number"
                                        placeholder="Amount"
                                        value={checkPayDialog.payAmount}
                                        onChange={e => setCheckPayDialog(d => ({ ...d, payAmount: e.target.value }))}
                                        className={INPUT + ' w-full text-base'}
                                        autoFocus
                                    />
                                )}
                                {/* Already collected */}
                                {(checkPayDialog.cash > 0 || checkPayDialog.edc > 0) && (
                                    <div className="mt-3 flex gap-3 text-[11px] text-slate-400">
                                        {checkPayDialog.cash > 0 && <span>Cash: {fmtMoney(checkPayDialog.cash)}</span>}
                                        {checkPayDialog.edc > 0  && <span>EDC: {fmtMoney(checkPayDialog.edc)}</span>}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Check-in status */}
                        <div className="space-y-4">
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Status</label>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => setCheckPayDialog(d => ({ ...d, checkedIn: true, noShow: false }))}
                                        className={`flex-1 py-2 rounded-xl text-sm font-bold transition-colors border ${
                                            checkPayDialog.checkedIn
                                                ? 'bg-emerald-100 border-emerald-300 text-emerald-700'
                                                : 'bg-white border-slate-200 text-slate-400 hover:border-slate-300'
                                        }`}>
                                        ✓ Checked In
                                    </button>
                                    <button
                                        onClick={() => setCheckPayDialog(d => ({ ...d, checkedIn: false, noShow: false }))}
                                        className={`flex-1 py-2 rounded-xl text-sm font-bold transition-colors border ${
                                            !checkPayDialog.checkedIn && !checkPayDialog.noShow
                                                ? 'bg-red-50 border-red-200 text-red-500'
                                                : 'bg-white border-slate-200 text-slate-400 hover:border-slate-300'
                                        }`}>
                                        ✗ Not In
                                    </button>
                                    <button
                                        onClick={() => setCheckPayDialog(d => ({ ...d, checkedIn: false, noShow: true }))}
                                        className={`flex-1 py-2 rounded-xl text-sm font-bold transition-colors border ${
                                            checkPayDialog.noShow
                                                ? 'bg-red-600 border-red-700 text-white'
                                                : 'bg-white border-slate-200 text-slate-400 hover:border-slate-300'
                                        }`}>
                                        ✗ No-Show
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Checked-in by</label>
                                <div className={INPUT + ' w-full text-slate-500 bg-slate-50 cursor-default'}>
                                    {checkPayDialog.checkedBy || '—'}
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mt-6">
                            <button onClick={() => setCheckPayDialog(null)}
                                className="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm uppercase tracking-widest transition-colors">
                                Cancel
                            </button>
                            <button onClick={saveCheckPay}
                                disabled={saving || (checkPayDialog.collect > 0 && (!checkPayDialog.payMethod || !parseFloat(checkPayDialog.payAmount)))}
                                className="py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm uppercase tracking-widest transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                {saving ? '...' : 'Save'}
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// ─── LeadsView ────────────────────────────────────────────────────────────────
function LeadsView({ tabs, activeTab, setActiveTab, onLogout }) {
    const token                     = localStorage.getItem(TOKEN_KEY) || '';
    const [dateFrom,   setDateFrom] = useState(todayBali);
    const [dateTo,     setDateTo]   = useState(todayBali);
    const [data,       setData]     = useState(null);
    const [loading,    setLoading]  = useState(false);
    const [error,      setError]    = useState('');
    const [detail,      setDetail]    = useState(null);
    const [showTotals,  setShowTotals] = useState(false);
    const [showBoats,   setShowBoats]  = useState(false);
    const [showFilters, setShowFilters] = useState(false);
    const [filters,     setFilters]   = useState({ boat: '', transfer: '', type: '' });
    const [page,        setPage]      = useState(1);
    const [search,      setSearch]    = useState('');
    const singleDay = dateFrom === dateTo;
    const load = useCallback(async (from, to, pg = 1) => {
        setLoading(true);
        setError('');
        try {
            const qs  = singleDay
                ? `date_from=${from}&date_to=${to}`
                : `date_from=${from}&date_to=${to}&page=${pg}`;
            const res  = await fetch(`/api/admin/leads?${qs}`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
            setData(json);
            setDetail(null);
            setFilters({ boat: '', transfer: '', type: '' });
            setSearch('');
            setShowBoats(false);
        } catch (e) {
            setError(e.message);
        } finally {
            setLoading(false);
        }
    }, [token, singleDay]);

    const updateOrder = useCallback(async (odooId, fields) => {
        const res = await fetch(`/api/admin/odoo/order/${odooId}`, {
            method: 'PATCH',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(fields),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        setData(prev => ({
            ...prev,
            orders: prev.orders.map(o => o.id === odooId ? { ...o, ...fields, ...json.odoo } : o),
        }));
    }, [token]);

    useEffect(() => { load(dateFrom, dateTo, page); }, [dateFrom, dateTo, page]); // eslint-disable-line

    const filtered = useMemo(() => {
        if (!data) return [];
        const q = search.trim().toLowerCase();
        return data.orders.filter(o => {
            if (filters.boat     && (o.x_studio_boat_name || '') !== filters.boat)                                                        return false;
            if (filters.transfer && (o.x_studio_car_type && o.x_studio_car_type !== false ? String(o.x_studio_car_type) : '') !== filters.transfer) return false;
            if (filters.type     && (o.x_studio_tour_type || '') !== filters.type)                                                        return false;
            if (q) {
                const hay = [
                    partnerName(o), o.x_studio_boat_name, String(o.id),
                    o.name, o.odoo_phone, o.client_order_ref,
                ].filter(Boolean).join(' ').toLowerCase();
                if (!hay.includes(q)) return false;
            }
            return true;
        });
    }, [data, filters, search]);

    const boats     = useMemo(() => data ? [...new Set(data.orders.map(o => o.x_studio_boat_name).filter(Boolean))].sort() : [], [data]);
    const transfers = useMemo(() => data ? [...new Set(data.orders.map(o => o.x_studio_car_type && o.x_studio_car_type !== false ? String(o.x_studio_car_type) : '').filter(Boolean))].sort() : [], [data]);
    const types     = useMemo(() => data ? [...new Set(data.orders.map(o => o.x_studio_tour_type || '').filter(Boolean))].sort() : [], [data]);
    const hasFilter = filters.boat || filters.transfer || filters.type || search;

    return (
        <div>
            <div className="sticky top-0 z-20 bg-slate-100 -mx-4 md:-mx-6 px-4 md:px-6 pt-1 pb-3 mb-4 shadow-[0_3px_10px_rgba(0,0,0,0.07)] overflow-x-auto">
                <DateRangeBar
                    menu={<MenuButton tabs={tabs} activeTab={activeTab} setActiveTab={setActiveTab} onLogout={onLogout} />}
                    dateFrom={dateFrom} dateTo={dateTo}
                    onFrom={v => { setDateFrom(v); setPage(1); }}
                    onTo={v => { setDateTo(v); setPage(1); }}
                    trailing={
                        <>
                            <div className="hidden md:flex items-center gap-2">
                                <input
                                    type="text"
                                    placeholder="Search…"
                                    value={search}
                                    onChange={e => setSearch(e.target.value)}
                                    className={INPUT + ' h-9 w-40'}
                                />
                                <select className={SELECT} value={filters.boat} onChange={e => setFilters(f => ({...f, boat: e.target.value}))}>
                                    <option value="">All boats</option>
                                    {boats.map(b => <option key={b} value={b}>{b}</option>)}
                                </select>
                                <select className={SELECT} value={filters.transfer} onChange={e => setFilters(f => ({...f, transfer: e.target.value}))}>
                                    <option value="">All transfers</option>
                                    {transfers.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                                <select className={SELECT} value={filters.type} onChange={e => setFilters(f => ({...f, type: e.target.value}))}>
                                    <option value="">All types</option>
                                    {types.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                                {hasFilter && (
                                    <button onClick={() => { setFilters({ boat: '', transfer: '', type: '' }); setSearch(''); }}
                                        className="text-[10px] text-red-500 hover:text-red-400 font-bold uppercase tracking-widest px-2 transition-colors">
                                        Clear
                                    </button>
                                )}
                                {data && <span className="text-[10px] text-slate-400 uppercase tracking-widest">{filtered.length} of {data.total}</span>}
                            </div>
                            <button onClick={() => setShowFilters(v => !v)} title="Filters"
                                className={`md:hidden h-9 w-9 flex items-center justify-center border rounded-lg transition-all shadow-sm relative ${showFilters ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-500 hover:text-slate-800'}`}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
                                    <polygon points="4 4 20 4 14 12 14 19 10 21 10 12 4 4" />
                                </svg>
                                {hasFilter && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-blue-500 border-2 border-slate-100" />}
                            </button>
                            <button onClick={() => setShowTotals(v => { const next = !v; if (!next) setShowBoats(false); return next; })}
                                className={`h-9 px-3 flex items-center gap-1.5 border rounded-lg text-sm font-bold uppercase tracking-wider transition-all shadow-sm ${showTotals ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-500 hover:text-slate-800'}`}>
                                Totals
                                {!singleDay && <span className={`text-[9px] font-bold tracking-widest ${showTotals ? 'text-slate-400' : 'text-slate-400'}`}>· page</span>}
                            </button>
                            <button onClick={() => load(dateFrom, dateTo, page)} disabled={loading}
                                className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 shadow-sm transition-all disabled:opacity-40 text-base">
                                ↺
                            </button>
                        </>
                    }
                    loading={loading}
                />
                {showFilters && (
                    <div className="md:hidden mt-2 flex flex-col gap-2">
                        <input
                            type="text"
                            placeholder="Search…"
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                            className={INPUT + ' h-9 w-full'}
                        />
                        <select className={SELECT + ' w-full'} value={filters.boat} onChange={e => setFilters(f => ({...f, boat: e.target.value}))}>
                            <option value="">All boats</option>
                            {boats.map(b => <option key={b} value={b}>{b}</option>)}
                        </select>
                        <select className={SELECT + ' w-full'} value={filters.transfer} onChange={e => setFilters(f => ({...f, transfer: e.target.value}))}>
                            <option value="">All transfers</option>
                            {transfers.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                        <select className={SELECT + ' w-full'} value={filters.type} onChange={e => setFilters(f => ({...f, type: e.target.value}))}>
                            <option value="">All types</option>
                            {types.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                        <div className="flex items-center justify-between">
                            {data && <span className="text-[10px] text-slate-400 uppercase tracking-widest">{filtered.length} of {data.total}</span>}
                            {hasFilter && (
                                <button onClick={() => { setFilters({ boat: '', transfer: '', type: '' }); setSearch(''); }}
                                    className="text-[10px] text-red-500 hover:text-red-400 font-bold uppercase tracking-widest px-2 transition-colors">
                                    Clear
                                </button>
                            )}
                        </div>
                    </div>
                )}
            </div>

            {error && (
                <div className="mb-4 rounded-2xl border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-600">{error}</div>
            )}
            {loading && (
                <div className="flex justify-center mt-16 text-blue-500 font-bold animate-pulse tracking-[0.2em] text-sm">LOADING FROM ODOO...</div>
            )}
            {!loading && data && (
                <div className={GLASS + (showTotals ? '' : ' overflow-hidden')}>
                    {showTotals
                        ? <div className="flex flex-col md:flex-row md:h-[calc(100vh-70px)]">
                            <div className="flex-1 min-w-0 overflow-y-auto md:h-full">
                                <TotalsView orders={filtered} />
                            </div>
                            {singleDay && (
                                <div className="hidden md:block w-72 shrink-0 border-l border-slate-100 p-6 overflow-y-auto h-full">
                                    <BoatAvailabilityPanel date={dateFrom} />
                                </div>
                            )}
                          </div>
                        : filtered.length === 0
                            ? <div className="py-16 text-center text-sm text-slate-400">No orders for {fmtDisplayDate(dateFrom)}{dateFrom !== dateTo ? ` — ${fmtDisplayDate(dateTo)}` : ''}</div>
                            : <LeadsTable orders={filtered} onRow={setDetail} updateOrder={updateOrder} />
                    }
                </div>
            )}

            {showTotals && singleDay && (
                <button onClick={() => setShowBoats(true)}
                    className="md:hidden fixed bottom-0 inset-x-0 z-40 h-14 pb-[env(safe-area-inset-bottom)] flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white shadow-[0_-4px_12px_rgba(0,0,0,0.15)] font-bold text-sm uppercase tracking-wider">
                    ⛵ Boats
                </button>
            )}

            {showBoats && (
                <div className="md:hidden fixed inset-0 z-50 flex items-end bg-black/40 backdrop-blur-sm" onClick={() => setShowBoats(false)}>
                    <div className="bg-white w-full rounded-t-3xl max-h-[80vh] overflow-y-auto p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                        <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4" />
                        <BoatAvailabilityPanel date={dateFrom} onClose={() => setShowBoats(false)} />
                    </div>
                </div>
            )}
            {!singleDay && data && data.last_page > 1 && (
                <div className="mt-4 flex items-center justify-between">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        Page {data.current_page} of {data.last_page} · {data.total} orders
                    </span>
                    <div className="flex gap-2">
                        <button disabled={page <= 1} onClick={() => setPage(p => p - 1)}
                            className={BTN + ' disabled:opacity-40'}>← Prev</button>
                        <button disabled={page >= data.last_page} onClick={() => setPage(p => p + 1)}
                            className={BTN + ' disabled:opacity-40'}>Next →</button>
                    </div>
                </div>
            )}
            {detail && <OrderDetailModal order={detail} onClose={() => setDetail(null)} />}
        </div>
    );
}

// ─── TotalsView ───────────────────────────────────────────────────────────────
function TotalsView({ orders }) {
    const [tab, setTab] = useState('type');
    const byType = {}, byBoat = {};
    let totalPax = 0, totalRevenue = 0, totalDeposit = 0, totalCollect = 0;

    orders.forEach(o => {
        const pax = Number(o.x_studio_count_of_people) || (Number(o.x_studio_adults) + Number(o.x_studio_kids)) || 0;
        totalPax     += pax;
        totalRevenue += Number(o.amount_total)      || 0;
        totalDeposit += Number(o.x_studio_deposit)  || 0;
        totalCollect += Number(o.x_studio_collect)  || 0;

        const type = o.x_studio_tour_type && o.x_studio_tour_type !== false ? String(o.x_studio_tour_type) : 'Unknown';
        if (!byType[type]) byType[type] = { pax: 0, orders: 0, revenue: 0, boats: {} };
        byType[type].pax     += pax;
        byType[type].orders  += 1;
        byType[type].revenue += Number(o.amount_total) || 0;
        if (o.x_studio_boat_name) {
            const b = o.x_studio_boat_name;
            if (!byType[type].boats[b]) byType[type].boats[b] = { orders: 0, pax: 0 };
            byType[type].boats[b].orders += 1;
            byType[type].boats[b].pax    += pax;
        }
        const boat = o.x_studio_boat_name || 'Unknown';
        byBoat[boat] = { pax: (byBoat[boat]?.pax || 0) + pax, orders: (byBoat[boat]?.orders || 0) + 1, revenue: (byBoat[boat]?.revenue || 0) + (Number(o.amount_total) || 0) };
    });

    const Bar = ({ val, max, cls }) => (
        <div className="flex-1 bg-slate-100 rounded-full h-1.5 overflow-hidden">
            <div className={`h-full rounded-full ${cls}`} style={{width: `${max ? Math.round(val / max * 100) : 0}%`}} />
        </div>
    );

    const typeEntries  = Object.entries(byType).sort((a, b) => b[1].orders - a[1].orders);
    const boatEntries  = Object.entries(byBoat).sort((a, b) => b[1].orders - a[1].orders);
    const maxTypeOrders = typeEntries[0]?.[1]?.orders || 1;
    const maxBoatOrders = boatEntries[0]?.[1]?.orders || 1;

    return (
        <div className="p-4 pb-24 md:p-6 md:pb-6 space-y-4 md:space-y-6">
            {/* Summary row — desktop */}
            <div className="hidden md:flex flex-wrap items-end gap-6">
                <div>
                    <div className="text-3xl font-bold text-slate-800">{orders.length}</div>
                    <div className="text-[10px] text-slate-400 uppercase tracking-widest mt-0.5">Orders</div>
                </div>
                <div>
                    <div className="text-3xl font-bold text-slate-800">{totalPax}</div>
                    <div className="text-[10px] text-slate-400 uppercase tracking-widest mt-0.5">People</div>
                </div>
                <div className="ml-2 pl-4 border-l border-slate-200 space-y-1">
                    <div className="flex items-baseline gap-2">
                        <span className="text-[10px] text-slate-400 uppercase tracking-widest w-20">Revenue</span>
                        <span className="text-base font-bold text-slate-800 tabular-nums">IDR {fmtMoney(totalRevenue)}</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                        <span className="text-[10px] text-slate-400 uppercase tracking-widest w-20">Deposit</span>
                        <span className="text-base font-semibold text-emerald-700 tabular-nums">IDR {fmtMoney(totalDeposit)}</span>
                    </div>
                    {totalCollect > 0 && (
                        <div className="flex items-baseline gap-2">
                            <span className="text-[10px] text-slate-400 uppercase tracking-widest w-20">To collect</span>
                            <span className="text-base font-semibold text-amber-500 tabular-nums">IDR {fmtMoney(totalCollect)}</span>
                        </div>
                    )}
                </div>
            </div>

            {/* Summary row — mobile (compact) */}
            <div className="md:hidden flex items-stretch divide-x divide-slate-100">
                <div className="pr-3">
                    <div className="text-xl font-bold text-slate-800 leading-none">{orders.length}</div>
                    <div className="text-[9px] text-slate-400 uppercase tracking-widest mt-1">Orders</div>
                </div>
                <div className="px-3">
                    <div className="text-xl font-bold text-slate-800 leading-none">{totalPax}</div>
                    <div className="text-[9px] text-slate-400 uppercase tracking-widest mt-1">People</div>
                </div>
                <div className="pl-3 flex-1 min-w-0 space-y-0.5">
                    <div className="flex justify-between gap-2 text-[11px]">
                        <span className="text-slate-400 uppercase tracking-wide">Revenue</span>
                        <span className="font-bold text-slate-800 tabular-nums">{fmtMoney(totalRevenue)}</span>
                    </div>
                    <div className="flex justify-between gap-2 text-[11px]">
                        <span className="text-slate-400 uppercase tracking-wide">Deposit</span>
                        <span className="font-semibold text-emerald-700 tabular-nums">{fmtMoney(totalDeposit)}</span>
                    </div>
                    {totalCollect > 0 && (
                        <div className="flex justify-between gap-2 text-[11px]">
                            <span className="text-slate-400 uppercase tracking-wide">Collect</span>
                            <span className="font-semibold text-amber-500 tabular-nums">{fmtMoney(totalCollect)}</span>
                        </div>
                    )}
                </div>
            </div>

            {/* Mobile tab switcher */}
            <div className="flex gap-2 md:hidden">
                <button onClick={() => setTab('type')}
                    className={`flex-1 h-9 rounded-lg text-sm font-bold uppercase tracking-wider transition-all border ${tab === 'type' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-500'}`}>
                    By Type
                </button>
                <button onClick={() => setTab('boat')}
                    className={`flex-1 h-9 rounded-lg text-sm font-bold uppercase tracking-wider transition-all border ${tab === 'boat' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-500'}`}>
                    By Boat
                </button>
            </div>

            {/* By Tour Type */}
            <div className={`${tab === 'type' ? 'block' : 'hidden'} md:block`}>
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 pb-1 border-b border-slate-100">By Tour Type</div>
                <div className="space-y-3">
                    {typeEntries.map(([type, { pax, orders: cnt, revenue, boats }]) => {
                        const priv     = type.toLowerCase().includes('private');
                        const boatList = Object.entries(boats).sort((a, b) => b[1].orders - a[1].orders);
                        return (
                            <div key={type}>
                                {/* Type header row */}
                                <div className="flex items-center gap-2 md:gap-3">
                                    <span className={`text-sm font-semibold w-24 md:w-44 shrink-0 truncate ${priv ? 'text-violet-600' : 'text-blue-600'}`}>{type}</span>
                                    <Bar val={cnt} max={maxTypeOrders} cls={priv ? 'bg-violet-400' : 'bg-blue-400'} />
                                    <span className="text-sm text-slate-400 w-8 md:w-10 text-right shrink-0 tabular-nums">{cnt}</span>
                                    <span className="text-base md:text-xl font-bold text-slate-800 w-12 md:w-14 text-right shrink-0 tabular-nums">{pax || 0} <span className="text-sm font-semibold text-slate-500">pax</span></span>
                                    <span className="hidden sm:inline text-sm text-slate-400 w-20 md:w-32 text-right shrink-0 tabular-nums">{fmtMoney(revenue)}</span>
                                </div>
                                {/* Boats under type */}
                                {boatList.length > 0 && (
                                    <div className="mt-1.5 ml-1 space-y-0.5">
                                        {boatList.map(([b, bs]) => (
                                            <div key={b} className="flex items-center gap-2 pl-3 border-l-2" style={{borderColor: priv ? '#ddd6fe' : '#bfdbfe'}}>
                                                <span className="text-[12px] font-medium text-slate-600 w-28 md:w-40 truncate shrink-0">{b}</span>
                                                <span className="text-[10px] text-slate-400 tabular-nums">{bs.orders} leads</span>
                                                <span className={`text-sm font-bold tabular-nums ${priv ? 'text-violet-600' : 'text-blue-600'}`}>{bs.pax} <span className="text-[10px] font-semibold opacity-70">pax</span></span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            </div>

            {/* By Boat */}
            <div className={`${tab === 'boat' ? 'block' : 'hidden'} md:block`}>
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 pb-1 border-b border-slate-100">By Boat</div>
                <div className="space-y-2">
                    {boatEntries.map(([boat, { pax, orders: cnt, revenue }]) => (
                        <div key={boat} className="flex items-center gap-2 md:gap-3">
                            <span className="text-sm text-slate-700 font-medium w-24 md:w-44 truncate shrink-0">{boat}</span>
                            <Bar val={cnt} max={maxBoatOrders} cls="bg-emerald-400" />
                            <span className="text-base md:text-xl font-bold text-slate-800 w-8 md:w-10 text-right shrink-0 tabular-nums">{cnt}</span>
                            <span className="text-sm text-slate-400 w-12 md:w-14 text-right shrink-0 tabular-nums">{pax || 0} pax</span>
                            <span className="hidden sm:inline text-sm text-slate-400 w-20 md:w-32 text-right shrink-0 tabular-nums">{fmtMoney(revenue)}</span>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    );
}

// ─── BoatAvailabilityPanel ────────────────────────────────────────────────────
function BoatAvailabilityPanel({ date, onClose }) {
    const [data,     setData]     = useState(null);
    const [loading,  setLoading]  = useState(false);
    const [editItem, setEditItem] = useState(null);

    const calHeaders = () => ({
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem(TOKEN_KEY) || ''}`,
    });

    const fetchData = useCallback(async () => {
        if (!date) return;
        setLoading(true);
        try {
            const res  = await fetch(`https://bluuu.tours/api/new/calendar/data?start=${date}&end=${date}`, { headers: calHeaders() });
            const json = await res.json();
            setData(json);
        } catch (e) { console.error(e); }
        setLoading(false);
    }, [date]);

    useEffect(() => { fetchData(); }, [fetchData]);

    const saveItem = async item => {
        try {
            const url = item.id
                ? `https://bluuu.tours/api/new/calendar/update/${item.id}`
                : `https://bluuu.tours/api/new/calendar/create`;
            await fetch(url, { method: 'POST', headers: calHeaders(), body: JSON.stringify(item) });
            await fetchData();
            setEditItem(null);
        } catch (e) { alert('Failed'); }
    };

    const deleteItem = async id => {
        if (!confirm('Delete this record?')) return;
        try {
            await fetch(`https://bluuu.tours/api/new/calendar/delete/${id}`, { method: 'POST', headers: calHeaders(), body: JSON.stringify({}) });
            await fetchData();
            setEditItem(null);
        } catch (e) { alert('Failed'); }
    };

    if (!data) return (
        <div className="flex justify-center items-center h-24 text-blue-500 text-xs font-bold animate-pulse uppercase tracking-widest">Loading…</div>
    );

    return (
        <div>
            <div className="flex items-center justify-between mb-3">
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Boat Availability</div>
                <div className="flex items-center gap-3">
                    <button onClick={fetchData} disabled={loading} title="Refresh"
                        className="text-slate-400 hover:text-slate-600 transition-colors text-base leading-none disabled:opacity-40">↺</button>
                    {onClose && (
                        <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-xl leading-none p-1 -m-1">×</button>
                    )}
                </div>
            </div>
            <div className="space-y-1.5">
                {data.boats.map(boat => {
                    const records = boat.closed_dates.filter(c => c.date === date);
                    const primary = records[0];
                    const isOpen  = records.length === 0;
                    const pax     = primary?.type === 1 ? records.reduce((s, r) => s + (Number(r.qtty) || 0), 0) : null;
                    const full    = pax !== null && boat.capacity && pax >= boat.capacity;

                    let sc, lbl;
                    if      (isOpen)          { sc = 'bg-emerald-100 text-emerald-700'; lbl = 'Open'; }
                    else if (full)            { sc = 'bg-orange-100  text-orange-600';  lbl = `Full ${pax}/${boat.capacity}`; }
                    else if (primary?.type === 1) { sc = 'bg-blue-100 text-blue-700';   lbl = `Shared ${pax}/${boat.capacity}`; }
                    else if (primary?.type === 3) { sc = 'bg-red-100   text-red-600';   lbl = 'Manual Block'; }
                    else if (primary?.type === 4) { sc = 'bg-slate-200 text-slate-500'; lbl = 'Auto'; }
                    else                      { sc = 'bg-violet-100 text-violet-600';    lbl = 'CRM'; }

                    return (
                        <div key={boat.id}
                            onClick={() => setEditItem({ ...(records[0] || {}), boatName: boat.name, boat_id: boat.id, date, allRecords: records, capacity: boat.capacity })}
                            className="flex items-center justify-between px-3 py-2.5 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-slate-300 transition-colors">
                            <div className="min-w-0 mr-2">
                                <div className="text-sm font-semibold text-slate-700 leading-tight truncate">{boat.name}</div>
                                <div className="text-[10px] text-slate-400">cap {boat.capacity}</div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg uppercase tracking-wide whitespace-nowrap ${sc}`}>{lbl}</span>
                                {isOpen && (
                                    <button onClick={e => { e.stopPropagation(); saveItem({ boat_id: boat.id, date, type: 3 }); }}
                                        className="text-[10px] font-bold text-slate-300 hover:text-red-500 transition-colors leading-none">
                                        Block
                                    </button>
                                )}
                            </div>
                        </div>
                    );
                })}
            </div>

            {editItem && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm" onClick={() => setEditItem(null)}>
                    <div className="bg-white border border-slate-200 rounded-3xl p-8 max-w-sm w-full shadow-2xl" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">{editItem.boatName}</h2>
                                <p className="text-blue-600 text-sm font-semibold uppercase tracking-widest mt-1">{fmtDisplayDate(date)}</p>
                            </div>
                            <button onClick={() => setEditItem(null)} className="p-2 hover:bg-slate-100 rounded-xl text-slate-400 hover:text-slate-700 transition-colors text-xl leading-none">×</button>
                        </div>
                        <div className="space-y-3 max-h-[40vh] overflow-y-auto pr-1">
                            {editItem.allRecords.map((r, i) => (
                                <div key={i} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Record #{i+1}</span>
                                        <button onClick={() => deleteItem(r.id)} className="text-red-500 hover:text-red-400 p-1 text-sm font-bold">✕</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Type</label>
                                            <select className={SELECT + ' w-full'} value={r.type} onChange={e => saveItem({...r, type: e.target.value})}>
                                                <option value="1">Shared</option>
                                                <option value="2">CRM</option>
                                                <option value="3">Manual</option>
                                                <option value="4">Auto</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Qty</label>
                                            <input type="number" className={INPUT + ' w-full'} value={r.qtty || 0} onChange={e => saveItem({...r, qtty: e.target.value})} />
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {!editItem.allRecords.length && (
                                <div className="text-center py-6 text-slate-400 text-sm italic">No closeddate records for this date.</div>
                            )}
                        </div>
                        <div className="mt-6 grid grid-cols-2 gap-3">
                            <button onClick={() => saveItem({ boat_id: editItem.boat_id, date, type: 3 })}
                                className="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-sm uppercase tracking-widest border border-slate-200 transition-colors">
                                + Block
                            </button>
                            <button onClick={() => setEditItem(null)}
                                className="py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl text-sm uppercase tracking-widest transition-colors">
                                Done
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// ─── LoginScreen ──────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
    const [managers, setManagers] = useState([]);
    const [name,     setName]     = useState('');
    const [password, setPassword] = useState('');
    const [loading,  setLoading]  = useState(false);
    const [error,    setError]    = useState('');

    useEffect(() => {
        fetch('/api/admin/managers')
            .then(r => r.json())
            .then(json => setManagers(Array.isArray(json.managers) ? json.managers : []))
            .catch(() => setManagers(CHECKIN_BY));
    }, []);

    const submit = async e => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
            const body = { password, page: 'manage' };
            if (name) body.username = name;
            const res  = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Wrong password');
            localStorage.setItem(TOKEN_KEY, json.token);
            const managerName = json.manager_name || name || '';
            if (managerName) localStorage.setItem(MANAGER_KEY, managerName);
            onLogin(json.token);
        } catch (e) {
            setError(e.message);
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="flex items-center justify-center min-h-screen">
            <div className="bg-white border border-slate-200 rounded-2xl shadow-xl p-8 w-full max-w-xs">
                <h1 className="text-base font-bold text-slate-800 mb-6 uppercase tracking-[0.2em] text-center">Bluuu Admin</h1>
                <form onSubmit={submit} className="space-y-3">
                    <select
                        value={name}
                        onChange={e => setName(e.target.value)}
                        className={SELECT + ' w-full'}
                    >
                        <option value="">Select your name…</option>
                        {managers.map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                    <input
                        type="password"
                        placeholder="Password"
                        value={password}
                        onChange={e => setPassword(e.target.value)}
                        className={INPUT + ' w-full'}
                    />
                    {error && <div className="text-xs text-red-500 font-semibold">{error}</div>}
                    <button type="submit" disabled={loading}
                        className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl uppercase tracking-widest text-sm transition-colors disabled:opacity-50">
                        {loading ? '...' : 'Enter'}
                    </button>
                </form>
            </div>
        </div>
    );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
    const [token,     setToken]     = useState(() => {
        const t = localStorage.getItem(TOKEN_KEY) || '';
        if (t && !localStorage.getItem(MANAGER_KEY)) {
            localStorage.removeItem(TOKEN_KEY);
            return '';
        }
        return t;
    });
    const [activeTab, setActiveTab] = useState('leads');

    if (!token) return <LoginScreen onLogin={setToken} />;

    const logout = () => { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(MANAGER_KEY); setToken(''); };

    const tabs = [
        { id: 'calendar', label: 'Calendar' },
        { id: 'leads',    label: 'Leads'    },
    ];

    const viewProps = { tabs, activeTab, setActiveTab, onLogout: logout };

    return (
        <div>
            {activeTab === 'calendar' && <CalendarView {...viewProps} />}
            {activeTab === 'leads'    && <LeadsView {...viewProps} />}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
