tabs:
    fields:
        title:
            label: Title
            span: auto
            type: text
            tab: Main
        classes:
            label: Class
            nameFrom: name
            descriptionFrom: description
            span: auto
            type: relation
            tab: Main
        odoo_name:
            label: 'Route name in Odoo'
            span: auto
            type: text
            tab: Main
        start:
            label: 'Start time'
            mode: time
            span: auto
            type: datepicker
            tab: Main
        end:
            label: 'End time'
            mode: time
            span: auto
            type: datepicker
            tab: Main
        restaurant:
            label: Restaurant
            nameFrom: name
            descriptionFrom: description
            span: auto
            type: relation
            tab: Main
        badge:
            label: Badge
            span: auto
            type: text
            tab: Main
        best_for:
            label: 'Best for'
            span: full
            type: text
            tab: Main
        description:
            label: Description
            span: full
            size: small
            type: textarea
            tab: Main
        highlights:
            label: Highlights
            span: full
            type: repeater
            itemsExpanded: false
            tab: Main
            form:
                fields:
                    label:
                        label: Text
                        type: text
                        span: auto

                    icon_svg:
                        label: 'Icon SVG'
                        type: codeeditor

                        size: small
                        span: left

                        comment: 'Paste an SVG from <a href="https://lucide.dev/icons/" target="_blank" rel="noopener">lucide.dev/icons</a> → click an icon → Copy SVG. Overrides Icon Name when filled in.'

        add_on_note:
            label: 'Add-on note (e.g. diver license required)'
            span: full
            type: text
            tab: Main
        popup_title:
            label: 'Popup title'
            span: auto
            type: text
            tab: Main
        popup_afternoon:
            label: 'Afternoon section description (popup)'
            span: full
            size: small
            type: textarea
            tab: Main
        schedule_before_lunch:
            label: 'Before lunch'
            span: full
            itemsExpanded: false
            type: repeater
            tab: Schedule
            form:
                fields: &schedule_item_fields
                    title:
                        label: Title
                        type: text
                        span: auto
                    time:
                        label: Time
                        type: text
                        span: auto
                    duration:
                        label: Duration
                        type: text
                        span: auto


                    highlight:
                        label: Highlight
                        type: dropdown
                        span: auto
                        default: ''
                        options:
                            '': None
                            premium: Premium
                            first-class: 'First class'
                        comment: 'Show a highlight badge for this activity (only for shared tours, not private tours).'
                    is_restaurant:
                        label: 'Show restaurant'
                        type: switch
                        span: full
                        default: 0
                        comment: 'Show the restaurant card for this step instead of add-ons'
                    icon_svg:
                        label: 'Icon SVG (optional, overrides name)'
                        type: codeeditor
                        size: small
                        span: full
                        cssClass: icon-svg-field
                        commentHtml: true
                        comment: 'Paste an SVG from <a href="https://lucide.dev/icons/" target="_blank" rel="noopener">lucide.dev/icons</a> → click an icon → Copy SVG. Overrides Icon Name when filled in.'
                    details:
                        label: 'Details / Text'
                        type: textarea
                        size: small
                        span: auto
                    extras:
                        label: 'Add-ons'
                        type: taglist
                        span: full
                        mode: array
                        options: getExtraOptions
                        comment: 'Select add-ons to show as options for this step'
        schedule_after_lunch:
            label: 'After lunch'
            span: full
            type: repeater
            tab: Schedule
            itemsExpanded: false
            form:
                fields: *schedule_item_fields
        schedule_photos:
            label: 'Schedule photos (in order)'
            span: full
            type: fileupload
            mode: image
            imageHeight: 100
            imageWidth: 100
            tab: Schedule
            comment: 'Assigned in order to schedule steps (before+after lunch) that have no photo of their own. Order = file sort order.'

        photos:
            label: Photos
            span: full
            type: fileupload
            mode: image
            imageHeight: 100
            imageWidth: 100
            tab: Images
        ecategories:
            label: 'Add-on categories'
            nameFrom: name
            descriptionFrom: description
            span: full
            context:
                - update
                - preview
            type: relation
            tab: Extras
        program:
            label: Program
            nameFrom: name
            descriptionFrom: description
            span: auto
            type: relation
            tab: Old
