        start:
            label: 'Время начала'
            mode: time
            span: auto
            type: datepicker
            tab: Main
        end:
            label: 'Время окончания'
            mode: time
            span: auto
            type: datepicker
            tab: Main


        restaurant:
            label: Ресторан
            nameFrom: name
            descriptionFrom: description
            span: auto
            type: relation
            tab: Main
        badge:
            label: Бейдж
            span: auto
            type: text
            tab: Main
        tone:
            label: Тон
            span: auto
            type: text
            tab: Main
        best_for:
            label: 'Подходит для'
            span: full
            type: text
            tab: Main
        best_with:
            label: 'Хорошо сочетается с'
            span: full
            type: text
            tab: Main
        description:
            label: Описание
            span: full
            size: small
            type: textarea
            tab: Main
        highlights:
            label: Особенности
            span: full
            type: repeater
            tab: Main
            form:
                fields:
                    label:
                        label: Текст
                        type: text
                        span: auto
                    icon_svg:
                        label: 'SVG иконки'
                        type: codeeditor
                        size: small
                        span: full
                        cssClass: icon-svg-field
                        commentHtml: true
                        comment: 'Вставьте SVG с <a href="https://lucide.dev/icons/" target="_blank" rel="noopener">lucide.dev/icons</a> → нажмите на иконку → Copy SVG. Заменяет Icon Name, если заполнено.'

        add_on_note:
            label: 'Заметка о доп. опции (например, требуется лицензия дайвера)'
            span: full
            type: text
            tab: Popup
        popup_title:
            label: 'Заголовок попапа'
            span: auto
            type: text
            tab: Popup
        popup_afternoon:
            label: 'Описание послеобеденной части (попап)'
            span: full
            size: small
            type: textarea
            tab: Popup
        schedule_before_lunch:
            label: 'Расписание: до обеда'
            span: full
            type: repeater
            tab: Popup
            form:
                fields:
                    type:
                        label: Тип
                        type: dropdown
                        span: auto
                        options:
                            item: Обычный слот
                            or-chip: Разделитель "или"
                        default: item
                    time:
                        label: Время
                        type: text
                        span: auto
                    duration:
                        label: Длительность
                        type: text
                        span: auto
                    title:
                        label: Заголовок
                        type: text
                        span: auto
                    is_restaurant:
                        label: 'Показывать ресторан'
                        type: switch
                        span: auto
                        default: 0
                        comment: 'Показывать карточку ресторана для этого шага вместо допуслуг'
                    highlight:
                        label: 'Выделение'
                        type: dropdown
                        span: auto
                        default: ''
                        options:
                            '': Нет
                            premium: Премиум
                            first-class: 'Первый класс'
                        comment: 'Показывать бейдж выделения для этой активности'
                    icon_name:
                        label: 'Название иконки'
                        type: text
                        span: auto
                        commentHtml: true
                        comment: 'Название иконки с <a href="https://lucide.dev/icons/" target="_blank" rel="noopener">lucide.dev</a>, например: Waves, Ship, Fish, Camera, UtensilsCrossed'
                    icon_svg:
                        label: 'SVG иконки (опционально, заменяет название)'
                        type: codeeditor
                        size: small
                        span: full
                        cssClass: icon-svg-field
                        commentHtml: true
                        comment: 'Вставьте SVG с <a href="https://lucide.dev/icons/" target="_blank" rel="noopener">lucide.dev/icons</a> → нажмите на иконку → Copy SVG. Заменяет Icon Name, если заполнено.'
                    details:
                        label: 'Детали / Текст'
                        type: textarea
                        size: small
                        span: full
                    info:
                        label: Подробное описание (попап)
                        type: textarea
                        size: small
                        span: full
                    is_addon:
                        label: Платная опция (добавляется отдельно)
                        type: checkbox
                        span: auto
                    extra_id:
                        label: ID связанного Extra
                        type: number
                        span: auto
                        comment: 'ID из таблицы extras — для кнопки добавления из расписания'
                    badges:
                        label: 'Теги (через запятую)'
                        type: text
                        span: full
                        comment: 'Например: 50 min from port, Bumpy road, Amazing views'
                    images:
                        label: 'Фото слота (URLs, по одному на строку)'
                        type: textarea
                        size: small
                        span: full
                    extras:
                        label: 'Дополнительные услуги'
                        type: taglist
                        span: full
                        mode: array
                        options: getExtraOptions
                        comment: 'Выберите допуслуги для показа как доп. опции для этого шага'
