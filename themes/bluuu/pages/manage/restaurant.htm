<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluuu Restaurant</title>
     <link rel="icon" type="image/png" href="https://bluuu.tours/themes/bluuu/assets/favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-6 font-['Outfit']">
<div id="root"></div>
{% verbatim %}
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const TOKEN_KEY = 'bluuu_restaurant_token';
const NAME_KEY  = 'bluuu_restaurant_name';
const MGMT_KEY  = 'bluuu_restaurant_mgmt';
const INPUT  = 'bg-white border border-slate-300 text-slate-800 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:border-blue-400';
const SELECT = 'bg-white border border-slate-300 text-slate-800 rounded-lg px-2.5 h-9 text-sm outline-none';

function todayBali() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Makassar' });
}
function shiftDay(ymd, n) {
    const d = new Date(ymd + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDisplayDate(ymd) {
    if (!ymd) return '';
    const [y, m, d] = ymd.split('-');
    return `${d}.${m}.${y}`;
}
function fmtTime(utcStr) {
    if (!utcStr) return null;
    return new Date(utcStr.replace(' ', 'T') + 'Z')
        .toLocaleTimeString('en-GB', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit' });
}
function strVal(v) {
    return v && v !== false ? String(v) : null;
}
function partnerName(o) {
    if (Array.isArray(o.partner_id)) return o.partner_id[1] || '—';
    return o.partner_id || o.name || '—';
}

// ─── group orders by boat ─────────────────────────────────────────────────────
function groupByBoat(orders) {
    const map = new Map();
    for (const o of orders) {
        const boatName = strVal(o.x_studio_boat_name) || 'Unknown boat';
        if (!map.has(boatName)) map.set(boatName, []);
        map.get(boatName).push(o);
    }
    return Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
}

// ─── BoatCard ─────────────────────────────────────────────────────────────────
function BoatCard({ boatName, orders, isManagement }) {
    // "Per lead" = booked headcount from the order itself — what was sold.
    // "Checked-in" = actual attendance recorded at check-in — what the
    // restaurant should really bill for. Orders not yet resolved (no
    // check-in/no-show recorded) contribute 0 to the checked-in total since
    // attendance isn't known yet.
    const totalPaxPerLead = orders.reduce((sum, o) => {
        return sum + (Number(o.x_studio_count_of_people) || (Number(o.x_studio_adults ?? 0) + Number(o.x_studio_kids ?? 0)));
    }, 0);
    const totalPaxCheckedIn = orders.reduce((sum, o) => {
        const resolved = o.x_studio_customer_checked_in_and_cleared === true || o.x_studio_no_show_1 === true;
        return sum + (resolved ? Number(o.x_studio_number_of_pax_checked_in ?? 0) : 0);
    }, 0);

    const time = fmtTime(orders[0].rental_start_date);

    const guides = [orders[0].x_studio_guide_1_1, orders[0].x_studio_guide_2_1].filter(v => v && v !== false).map(String);

    const tourTypes = [...new Set(orders.map(o => strVal(o.x_studio_tour_type)).filter(Boolean))];

    const allPassengers = orders
        .map(o => strVal(o.x_studio_passenger_list))
        .filter(Boolean)
        .join('\n');

    const requests = orders
        .map(o => ({ client: partnerName(o), text: strVal(o.x_studio_special_requests), lunch: strVal(o.x_studio_lunch) }))
        .filter(r => r.text);

    const dietaryRequirements = orders
        .map(o => ({ client: partnerName(o), text: strVal(o.x_studio_dietary_requirements) }))
        .filter(r => r.text);

    const menuSelections = orders
        .map(o => ({ client: partnerName(o), text: strVal(o.x_studio_first_class_menu_selection) }))
        .filter(r => r.text);

    const noShows = orders
        .filter(o => o.x_studio_no_show_1 === true)
        .map(o => partnerName(o));

    return (
        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col">
            <div className="px-4 pt-3 pb-2 border-b border-slate-100 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 min-w-0">
                    <span className="text-sm font-bold text-slate-800 truncate">{boatName}</span>
                    {tourTypes.map(t => {
                        const priv = t.toLowerCase().includes('private');
                        return <span key={t} className={`text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-widest shrink-0 ${priv ? 'bg-violet-100 text-violet-600' : 'bg-blue-100 text-blue-600'}`}>{t}</span>;
                    })}
                </div>
                <span className="text-xs text-slate-400 shrink-0">{orders.length} order{orders.length !== 1 ? 's' : ''}</span>
            </div>
            <div className="px-4 py-3 space-y-3 flex-1">
                {time && (
                    <div className="flex items-center gap-2">
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0">Departure</span>
                        <span className="text-slate-800 text-sm font-bold">{time}</span>
                    </div>
                )}
                {guides.length > 0 && (
                    <div className="flex items-center gap-2">
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0">Guides</span>
                        <span className="text-slate-700 text-sm">{guides.join(', ')}</span>
                    </div>
                )}
                <div className="flex items-center gap-2">
                    <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0">Total checked-in pax</span>
                    <span className="text-2xl font-bold text-emerald-600">{totalPaxCheckedIn}</span>
                </div>
                <div className="flex items-center gap-2">
                    <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0">Total pax per lead</span>
                    <span className="text-lg font-bold text-slate-400">{totalPaxPerLead}</span>
                </div>
                {noShows.length > 0 && (
                    <div className="flex items-start gap-2">
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest w-28 shrink-0 pt-0.5">No Show</span>
                        <div className="flex flex-wrap gap-1.5">
                            {noShows.map((n, i) => (
                                <span key={i} className="text-xs font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-600">{n}</span>
                            ))}
                        </div>
                    </div>
                )}
                {allPassengers && (
                    <div>
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest block mb-1">Passengers</span>
                        <div className="bg-slate-50 rounded-xl px-3 py-2 text-sm text-slate-700 whitespace-pre-line leading-relaxed border border-slate-100">
                            {allPassengers}
                        </div>
                    </div>
                )}
                {requests.length > 0 && (
                    <div>
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest block mb-1">Special Requests</span>
                        <div className="space-y-1.5">
                            {requests.map((r, i) => (
                                <div key={i} className="bg-amber-50 border border-amber-100 rounded-xl px-3 py-2 text-sm text-slate-700">
                                    {orders.length > 1 && <span className="font-semibold text-slate-600">{r.client}: </span>}
                                    <span className="whitespace-pre-line">{r.text}</span>
                                    {isManagement && r.lunch && (
                                        <span className="block text-[10px] font-bold text-amber-500 uppercase tracking-widest mt-0.5">{r.lunch}</span>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                {dietaryRequirements.length > 0 && (
                    <div>
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest block mb-1">Dietary Requirements</span>
                        <div className="space-y-1.5">
                            {dietaryRequirements.map((r, i) => (
                                <div key={i} className="bg-rose-50 border border-rose-100 rounded-xl px-3 py-2 text-sm text-slate-700">
                                    {orders.length > 1 && <span className="font-semibold text-slate-600">{r.client}: </span>}
                                    <span className="whitespace-pre-line">{r.text}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                {menuSelections.length > 0 && (
                    <div>
                        <span className="text-slate-500 text-xs font-semibold uppercase tracking-widest block mb-1">Menu Selection</span>
                        <div className="space-y-1.5">
                            {menuSelections.map((r, i) => (
                                <div key={i} className="bg-sky-50 border border-sky-100 rounded-xl px-3 py-2 text-sm text-slate-700">
                                    {orders.length > 1 && <span className="font-semibold text-slate-600">{r.client}: </span>}
                                    <span className="whitespace-pre-line">{r.text}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                {isManagement && (
                    <div className="pt-1 border-t border-slate-100">
                        <div className="flex flex-wrap gap-1.5 mt-2">
                            {[...new Set(orders.map(o => strVal(o.x_studio_lunch)).filter(Boolean))].map(r => (
                                <span key={r} className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 uppercase tracking-widest">{r}</span>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
}

// ─── LoginScreen ──────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
    const [accounts, setAccounts] = useState([]);
    const [name,     setName]     = useState('');
    const [password, setPassword] = useState('');
    const [loading,  setLoading]  = useState(false);
    const [error,    setError]    = useState('');

    useEffect(() => {
        fetch('/api/admin/restaurant/accounts')
            .then(r => r.json())
            .then(json => setAccounts(Array.isArray(json.accounts) ? json.accounts : []))
            .catch(() => {});
    }, []);

    const submit = async e => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
            const res  = await fetch('/api/admin/restaurant/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, password }),
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Wrong password');
            localStorage.setItem(TOKEN_KEY, json.token);
            localStorage.setItem(NAME_KEY,  json.name);
            localStorage.setItem(MGMT_KEY,  json.is_management ? '1' : '');
            onLogin({ token: json.token, name: json.name, isManagement: !!json.is_management });
        } catch (e) {
            setError(e.message);
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="flex items-center justify-center min-h-screen">
            <div className="bg-white border border-slate-200 rounded-2xl shadow-xl p-8 w-full max-w-xs">
                <h1 className="text-base font-bold text-slate-800 mb-6 uppercase tracking-[0.2em] text-center">Bluuu Restaurant</h1>
                <form onSubmit={submit} className="space-y-3">
                    <select value={name} onChange={e => setName(e.target.value)} className={SELECT + ' w-full'}>
                        <option value="">Select restaurant…</option>
                        {accounts.map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                    <input type="password" placeholder="Password" value={password}
                        onChange={e => setPassword(e.target.value)}
                        className={INPUT + ' w-full'} autoFocus />
                    {error && <div className="text-xs text-red-500 font-semibold">{error}</div>}
                    <button type="submit" disabled={loading}
                        className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl uppercase tracking-widest text-sm transition-colors disabled:opacity-50">
                        {loading ? '...' : 'Enter'}
                    </button>
                </form>
            </div>
        </div>
    );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
    const [session, setSession] = useState(() => {
        const token = localStorage.getItem(TOKEN_KEY) || '';
        if (!token) return null;
        return { token, name: localStorage.getItem(NAME_KEY) || '', isManagement: localStorage.getItem(MGMT_KEY) === '1' };
    });
    const [date,             setDate]             = useState(todayBali);
    const [data,             setData]             = useState(null);
    const [loading,          setLoading]          = useState(false);
    const [error,            setError]            = useState('');
    const [boatFilter,       setBoatFilter]       = useState('all');
    const [restaurantFilter, setRestaurantFilter] = useState('all');

    const load = useCallback(async d => {
        if (!session) return;
        setLoading(true);
        setError('');
        try {
            const res  = await fetch(`/api/admin/restaurant/leads?date_from=${d}&date_to=${d}`, {
                headers: { Authorization: `Bearer ${session.token}` }
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
            setData(json);
        } catch (e) {
            setError(e.message);
        } finally {
            setLoading(false);
        }
    }, [session]);

    useEffect(() => { load(date); setBoatFilter('all'); setRestaurantFilter('all'); }, [date, load]);

    const logout = () => {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(NAME_KEY);
        localStorage.removeItem(MGMT_KEY);
        setSession(null);
        setData(null);
    };

    const isManagement = !!session?.isManagement;

    const restaurantOptions = useMemo(() =>
        isManagement
            ? [...new Set((data?.orders || []).map(o => strVal(o.x_studio_lunch)).filter(Boolean))].sort()
            : []
    , [data, isManagement]);

    const orders = useMemo(() => {
        let list = (data?.orders || []);
        if (isManagement && restaurantFilter !== 'all') {
            list = list.filter(o => strVal(o.x_studio_lunch) === restaurantFilter);
        }
        return list.slice().sort((a, b) => {
            const ta = a.rental_start_date || '';
            const tb = b.rental_start_date || '';
            return ta < tb ? -1 : ta > tb ? 1 : 0;
        });
    }, [data, isManagement, restaurantFilter]);

    const boatGroups = useMemo(() => groupByBoat(orders), [orders]);

    const visibleGroups = useMemo(() =>
        boatFilter === 'all' ? boatGroups : boatGroups.filter(([name]) => name === boatFilter)
    , [boatGroups, boatFilter]);

    if (!session) return <LoginScreen onLogin={setSession} />;

    const isToday = date === todayBali();

    return (
        <div>
            {/* Sticky header */}
            <div className="sticky top-0 z-30 bg-slate-100 -mx-4 md:-mx-6 px-4 md:px-6 py-3 flex flex-wrap items-center gap-2 border-b border-slate-200/80 shadow-[0_3px_10px_rgba(0,0,0,0.07)]">
                <span className="text-sm font-bold text-slate-500 uppercase tracking-widest mr-1">{session.name || 'Restaurant'}</span>

                {boatGroups.length > 0 && (
                    <select value={boatFilter} onChange={e => setBoatFilter(e.target.value)} className={SELECT}>
                        <option value="all">All boats</option>
                        {boatGroups.map(([name]) => (
                            <option key={name} value={name}>{name}</option>
                        ))}
                    </select>
                )}

                {session.isManagement && restaurantOptions.length > 0 && (
                    <select value={restaurantFilter} onChange={e => setRestaurantFilter(e.target.value)} className={SELECT}>
                        <option value="all">All restaurants</option>
                        {restaurantOptions.map(r => (
                            <option key={r} value={r}>{r}</option>
                        ))}
                    </select>
                )}

                <div className="flex-1" />
                {loading && <span className="text-[10px] text-blue-500 animate-pulse uppercase tracking-widest">Loading…</span>}
                {data && <span className="text-[10px] text-slate-400 uppercase tracking-widest">{boatGroups.length} boats · {orders.length} orders</span>}

                {/* Date nav */}
                <div className="flex items-center gap-1">
                    <button onClick={() => setDate(d => shiftDay(d, -1))}
                        className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 shadow-sm transition-all text-xl font-bold leading-none">
                        ‹
                    </button>
                    <button onClick={() => !isToday && setDate(todayBali())}
                        className={`h-9 px-4 flex items-center border rounded-lg text-sm font-bold shadow-sm transition-all ${isToday ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'}`}>
                        {fmtDisplayDate(date)}
                    </button>
                    <button onClick={() => setDate(d => shiftDay(d, 1))}
                        className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 shadow-sm transition-all text-xl font-bold leading-none">
                        ›
                    </button>
                </div>
                <button onClick={() => load(date)} disabled={loading}
                    className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 shadow-sm transition-all disabled:opacity-40 text-base">
                    ↺
                </button>
                <button onClick={logout}
                    className="h-9 px-3 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-red-500 hover:text-red-400 hover:border-red-200 shadow-sm transition-all text-xs font-bold uppercase tracking-widest">
                    Logout
                </button>
            </div>

            {/* Content */}
            <div className="mt-5">
                {error && (
                    <div className="mb-4 rounded-2xl border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-600">{error}</div>
                )}
                {loading && (
                    <div className="flex justify-center mt-16 text-blue-500 font-bold animate-pulse tracking-[0.2em] text-sm">LOADING FROM ODOO...</div>
                )}
                {!loading && data && orders.length === 0 && (
                    <div className="text-center py-16 text-sm text-slate-400">No orders for {fmtDisplayDate(date)}</div>
                )}
                {!loading && visibleGroups.length > 0 && (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        {visibleGroups.map(([boatName, boatOrders]) => (
                            <BoatCard key={boatName} boatName={boatName} orders={boatOrders} isManagement={session.isManagement} />
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endverbatim %}
</body>
</html>
