fields:

    name:
        label: Name
        span: auto
        type: text
    odoo_id:
        type: number
        label: Odoo ID
        span: auto

    description:
        label: Description
        size: large
        span: left
        type: richeditor
    menu:
        label: 'Menu (HTML)'
        size: large
        span: full
        type: richeditor
    menu_sections:
        label: 'Menu (structured)'
        span: full
        type: repeater
        prompt: 'Add category'
        form:
            fields:
                title:
                    label: 'Category'
                    type: text
                    span: full
                    placeholder: 'e.g. Starters, Main Course, Dessert, Drinks'
                items:
                    label: Dishes
                    type: repeater
                    span: full
                    prompt: 'Add dish'
                    form:
                        fields:
                            name:
                                label: Name
                                type: text
                                span: auto
                                placeholder: 'e.g. Caesar salad'
                            description:
                                label: 'Short description'
                                type: text
                                span: auto
                                placeholder: 'e.g. Fresh romaine, parmesan, croutons'
        
    menu_note:
        label: 'Menu note (shown below menu)'
        span: full
        type: textarea
        size: small
        placeholder: 'e.g. Should you desire cocktails, wine or other selections, please ask for the restaurant''s general menu...'
    images:
        label: Images
        mode: image
        imageWidth: '100'
        imageHeight: '100'
        useCaption: 0
        thumbOptions:
            mode: crop
            extension: auto
        span: auto
        type: fileupload

    amo_name:
        label: 'Amo Name'
        span: auto
        type: text

    odoo_name:
        label: 'Odoo Lunch Name'
        span: auto
        type: text
    included:
        type: switch
        label: Included
        span: full