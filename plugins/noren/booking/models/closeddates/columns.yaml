        label: Odoo
        type: number
        searchable: true
        sortable: true



    type:
        label: Type
        type: selectable
        options:
            1: Private
            2: Shared
            3: Manual
            4: Auto
            empty: Manual 2
        
        
    tour_type:
        label: Tour Type
        type: text
        
    created_at:
        label: Created
        type: datetime
        searchable: true
        sortable: true
        format: 'Y-m-d H:i:s'
    updated_at:
        label: Updated
        type: datetime
        searchable: true
        sortable: true
        format: 'Y-m-d H:i:s'
