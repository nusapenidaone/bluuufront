fields:
    name:
        label: Name
        span: left
        type: text
        placeholder: 'Low season Jan–Mar 2027'
    is_active:
        label: Active
        span: right
        type: switch
        default: 1
    date_start:
        label: 'Date start'
        span: left
        type: datepicker
        mode: date
    date_end:
        label: 'Date end'
        span: right
        type: datepicker
        mode: date
    percent:
        label: 'Discount (%)'
        span: left
        type: number
        min: 1
        max: 90
        comment: 'Applies to the tour price (+ boat price for private). Transfer, cover and extras are not discounted.'
    tours:
        label: Tours
        span: full
        type: relation
        nameFrom: name
        comment: 'Tours this discount applies to'
