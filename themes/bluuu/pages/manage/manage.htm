<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const TOKEN_KEY   = 'bluuu_admin_token';
const MANAGER_KEY = 'bluuu_admin_manager';

const INPUT  = 'bg-white border border-slate-300 text-slate-800 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:border-blue-400';
const SELECT = 'bg-white border border-slate-300 text-slate-800 rounded-lg px-2.5 h-9 text-sm outline-none';
const GLASS  = 'bg-white border border-slate-200 shadow-sm';
const BTN    = 'bg-white border border-slate-200 text-slate-500 hover:text-slate-800 px-3 py-1.5 rounded-lg text-sm font-semibold transition-all shadow-sm';
const TH     = 'px-3 py-2.5 text-left text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-200 whitespace-nowrap bg-slate-50';
const TD     = 'px-3 py-2.5 border-b border-slate-100 align-top text-sm text-slate-700 whitespace-nowrap';

const LANYARD_COLORS = [
    { value: 'Blue',              color: '#3b82f6' },
    { value: 'Turquoise',         color: '#06b6d4' },
    { value: 'Black',             color: '#1e293b' },
    { value: 'White',             color: '#e2e8f0', border: '#94a3b8' },
    { value: 'Grey',              color: '#94a3b8' },
    { value: 'Indigo/Royal Blue', color: '#4f46e5' },
    { value: 'Violet/Purple',     color: '#8b5cf6' },
    { value: 'Sea Green',         color: '#0d9488' },
    { value: 'Emerald Green',     color: '#10b981' },
    { value: 'Forrest Green',     color: '#15803d' },
    { value: 'Yello',             color: '#eab308' },
    { value: 'Orange',            color: '#f97316' },
    { value: 'Brown',             color: '#92400e' },
    { value: 'Pink',              color: '#ec4899' },
];
function lanyardColorInfo(value) {
    return LANYARD_COLORS.find(c => c.value === value) || null;
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const monthRange = (y, m) => ({ start: fmt(new Date(y, m, 1)), end: fmt(new Date(y, m+1, 0)) });
const now = new Date();

function todayBali() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Makassar' });
}
function baliOffset(n) {
    const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Makassar' }));
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function baliMonthRange(offset = 0) {
    const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Makassar' }));
    const y = d.getFullYear(), m = d.getMonth() + offset;
    const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
    return { start: fmt(first), end: fmt(last) };
}
function baliWeekRange() {
    const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Makassar' }));
    const day = d.getDay() || 7;
    const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { start: fmt(mon), end: fmt(sun) };
}
function fmtDisplayDate(ymd) {
    if (!ymd) return '';
    const [y, m, d] = ymd.split('-');
    return `${d}.${m}.${y}`;
}
function fmtDisplayDateShort(ymd) {
    if (!ymd) return '';
    const [, m, d] = ymd.split('-');
    return `${d}.${m}`;
}
function fmtMoney(v) {
    if (!v && v !== 0) return '—';
    return Number(v).toLocaleString('id-ID');
}
function odooDateBali(utcStr) {
    if (!utcStr) return '—';
    return fmtDisplayDate(new Date(utcStr.replace(' ', 'T') + 'Z').toLocaleDateString('en-CA', { timeZone: 'Asia/Makassar' }));
}
function fmtOdooDate(utcStr) {
    if (!utcStr) return '—';
    const d = new Date(utcStr.replace(' ', 'T') + 'Z');
    const date = d.toLocaleDateString('ru-RU', { timeZone: 'Asia/Makassar' });
    const time = d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit' });
    return `${date} ${time}`;
}
function tourTypeName(o) {
    if (o.x_studio_tour_type && o.x_studio_tour_type !== false) return String(o.x_studio_tour_type);
    return null;
}
function isPrivate(o) {
    return (o.x_studio_tour_type || '').toLowerCase().includes('private');
}
function partnerName(o) {
    if (Array.isArray(o.partner_id)) return o.partner_id[1] || '—';
    return o.partner_id || o.local_name || '—';
}
function srcLabel(o) {
    const s = o.x_studio_source;
    return (!s || s === false) ? '' : String(s);
}
const statusCls = type => {
    if (type === 4) return 'bg-slate-300 text-slate-600';
    if (type === 1) return 'bg-blue-500 text-white';
    if (type === 2) return 'bg-violet-500 text-white';
    if (type === 3) return 'bg-red-500 text-white';
    return 'bg-violet-500 text-white'; // null/unknown → CRM
};
const statusLabel = (type, records, capacity) => {
    if (type === 4) return 'AUTO';
    if (type === 1) {
        const pax = records.reduce((s, r) => s + (Number(r.qtty) || 0), 0);
        return capacity ? `${pax}/${capacity}` : `${pax}`;
    }
    if (type === 2) return 'CRM';
    if (type === 3) return 'BLOCK';
    return 'CRM'; // null/unknown → CRM
};

// ─── MiniCalendar ─────────────────────────────────────────────────────────────
function MiniCalendar({ value, onChange, rangeFrom, rangeTo }) {
    const parsed = value ? new Date(value + 'T00:00:00') : new Date();
    const [vy, setVy] = useState(parsed.getFullYear());
    const [vm, setVm] = useState(parsed.getMonth());

    const DAYS   = ['Mo','Tu','We','Th','Fr','Sa','Su'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    const firstDay    = new Date(vy, vm, 1);
    const lastDay     = new Date(vy, vm + 1, 0);
    const startOffset = (firstDay.getDay() + 6) % 7;

    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= lastDay.getDate(); d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);

    const todayStr = todayBali();
    const prevMonth = () => vm === 0 ? (setVm(11), setVy(y => y - 1)) : setVm(m => m - 1);
    const nextMonth = () => vm === 11 ? (setVm(0),  setVy(y => y + 1)) : setVm(m => m + 1);

    return (
        <div className="p-3 w-[232px] select-none">
            <div className="flex items-center justify-between mb-2">
                <button onClick={prevMonth} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 font-bold text-lg leading-none">‹</button>
                <span className="text-sm font-bold text-slate-700">{MONTHS[vm]} {vy}</span>
                <button onClick={nextMonth} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 font-bold text-lg leading-none">›</button>
            </div>
            <div className="grid grid-cols-7 mb-1">
                {DAYS.map(d => <div key={d} className="text-center text-[10px] font-bold text-slate-400 py-0.5">{d}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-y-0.5">
                {cells.map((d, i) => {
                    if (!d) return <div key={i} />;
                    const dateStr    = `${vy}-${String(vm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const isSelected = dateStr === value;
                    const isToday    = dateStr === todayStr;
                    const inRange    = rangeFrom && rangeTo && dateStr > rangeFrom && dateStr < rangeTo;
                    const isEdge     = dateStr === rangeFrom || dateStr === rangeTo;
                    let cls = 'w-full aspect-square flex items-center justify-center rounded-lg text-md font-semibold cursor-pointer transition-colors ';
                    if (isSelected)     cls += 'bg-blue-600 text-white';
                    else if (isEdge)    cls += 'bg-blue-500 text-white';
                    else if (inRange)   cls += 'bg-blue-100 text-blue-700';
                    else if (isToday)   cls += 'text-blue-600 font-bold hover:bg-blue-50';
                    else                cls += 'text-slate-700 hover:bg-slate-100';
                    return <div key={i} className={cls} onClick={() => onChange(dateStr)}>{d}</div>;
                })}
            </div>
        </div>
    );
}

// ─── DatePicker ───────────────────────────────────────────────────────────────
function DatePicker({ value, onChange, rangeFrom, rangeTo, align = 'left' }) {
    const [open, setOpen] = useState(false);
    const [pos,  setPos]  = useState({ top: 0, left: 0 });
    const btnRef  = useRef(null);
    const dropRef = useRef(null);

    useEffect(() => {
        if (!open) return;
        const handler = e => {
            if (btnRef.current?.contains(e.target) || dropRef.current?.contains(e.target)) return;
            setOpen(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
    }, [open]);

    const handleToggle = () => {
        if (!open && btnRef.current) {
            const r = btnRef.current.getBoundingClientRect();
            setPos({ top: r.bottom + 6, left: align === 'right' ? r.right - 232 : r.left });
        }
        setOpen(o => !o);
    };

    return (
        <div>
            <button ref={btnRef} onClick={handleToggle}
                className={`h-full px-1.5 md:px-2.5 text-sm font-bold whitespace-nowrap transition-colors ${open ? 'text-blue-600' : 'text-slate-800 hover:text-slate-600'}`}>
                <span className="md:hidden">{fmtDisplayDateShort(value)}</span>
                <span className="hidden md:inline">{fmtDisplayDate(value)}</span>
            </button>
            {open && ReactDOM.createPortal(
                <div ref={dropRef} style={{ position: 'fixed', top: pos.top, left: pos.left, zIndex: 9999 }}
                    className="bg-white border border-slate-200 rounded-2xl shadow-xl">
                    <MiniCalendar value={value} onChange={v => { onChange(v); setOpen(false); }} rangeFrom={rangeFrom} rangeTo={rangeTo} />
                </div>,
                document.body
            )}
        </div>
    );
}

// ─── MenuButton ───────────────────────────────────────────────────────────────
function MenuButton({ tabs, activeTab, setActiveTab, onLogout }) {
    const [open, setOpen] = useState(false);
    const [pos,  setPos]  = useState({ top: 0, left: 0 });
    const btnRef  = useRef(null);
    const dropRef = useRef(null);

    useEffect(() => {
        if (!open) return;
        const handler = e => {
            if (btnRef.current?.contains(e.target) || dropRef.current?.contains(e.target)) return;
            setOpen(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
    }, [open]);

    const toggle = () => {
        if (!open && btnRef.current) {
            const r = btnRef.current.getBoundingClientRect();
            setPos({ top: r.bottom + 6, left: r.left });
        }
        setOpen(o => !o);
    };

    return (
        <div>
            <button ref={btnRef} onClick={toggle}
                className={`h-9 w-9 flex items-center justify-center bg-white border rounded-lg shadow-sm transition-all text-base ${open ? 'text-blue-600 border-blue-300' : 'text-slate-600 border-slate-200 hover:text-slate-800 hover:border-slate-300'}`}>
                ☰
            </button>
            {open && ReactDOM.createPortal(
                <div ref={dropRef} style={{ position: 'fixed', top: pos.top, left: pos.left, zIndex: 9999 }}
                    className="bg-white border border-slate-200 rounded-2xl shadow-xl p-1.5 min-w-[170px]">
                    {tabs.map(tab => (
                        <button key={tab.id}
                            onClick={() => { setActiveTab(tab.id); setOpen(false); }}
                            className={`w-full text-left px-3 py-2 rounded-xl text-sm font-bold uppercase tracking-wider transition-colors ${activeTab === tab.id ? 'bg-slate-800 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                            {tab.label}
                        </button>
                    ))}
                    <div className="my-1.5 border-t border-slate-100" />
                    <button onClick={() => { setOpen(false); onLogout(); }}
                        className="w-full text-left px-3 py-2 rounded-xl text-sm font-bold uppercase tracking-wider text-red-500 hover:bg-red-50 transition-colors">
                        Logout
                    </button>
                </div>,
                document.body
            )}
        </div>
    );
}

// ─── DateRangeBar ─────────────────────────────────────────────────────────────
function DateRangeBar({ dateFrom, dateTo, onFrom, onTo, navPrev, navNext, trailing, loading, menu }) {
    return (
        <div className="flex items-center gap-1.5 md:gap-2 min-w-max">
            {menu}
            <div className="flex items-center gap-1">
                {navPrev && (
                    <button onClick={navPrev}
                        className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 hover:border-slate-300 shadow-sm transition-all text-xl font-bold leading-none">
                        ‹
                    </button>
                )}
                <div className="flex items-center bg-white border border-slate-300 rounded-lg h-9 shadow-sm overflow-visible">
                    <DatePicker
                        value={dateFrom}
                        onChange={v => { onFrom(v); if (v > dateTo) onTo(v); }}
                        rangeFrom={dateFrom} rangeTo={dateTo}
                        align="left"
                    />
                    <span className="text-slate-300 select-none">–</span>
                    <DatePicker
                        value={dateTo}
                        onChange={v => { onTo(v); if (v < dateFrom) onFrom(v); }}
                        rangeFrom={dateFrom} rangeTo={dateTo}
                        align="right"
                    />
                </div>
                {navNext && (
                    <button onClick={navNext}
                        className="h-9 w-9 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 hover:border-slate-300 shadow-sm transition-all text-xl font-bold leading-none">
                        ›
                    </button>
                )}
            </div>
            <div className="flex-1" />
            {loading && <span className="text-[10px] text-blue-500 animate-pulse uppercase tracking-widest">Loading…</span>}
            {trailing}
        </div>
    );
}

// ─── CalendarView ─────────────────────────────────────────────────────────────
function CalendarView({ tabs, activeTab, setActiveTab, onLogout }) {
    const [data,          setData]          = useState({ boats: [], tours: [] });
    const [loading,       setLoading]       = useState(true);
    const [startDate,     setStartDate]     = useState(() => todayBali());
    const [endDate,       setEndDate]       = useState(() => baliOffset(2));
    const [selectedClass, setSelectedClass] = useState('');
    const [selectedTour,  setSelectedTour]  = useState('');
    const [editItem,      setEditItem]      = useState(null);

    const fetchData = useCallback(async () => {
        setLoading(true);
        try {
            const res  = await fetch(`https://bluuu.tours/api/new/calendar/data?start=${startDate}&end=${endDate}`, { headers: calendarHeaders() });
            const json = await res.json();
            setData(json);
        } catch (e) { console.error(e); }
        setLoading(false);
    }, [startDate, endDate]);

    useEffect(() => { fetchData(); }, [fetchData]);

    const days = useMemo(() => {
        const result = [], cur = new Date(startDate + 'T00:00:00'), end = new Date(endDate + 'T00:00:00');
        while (cur <= end) { result.push(fmt(cur)); cur.setDate(cur.getDate() + 1); }
        return result;
    }, [startDate, endDate]);

    const shiftRange = d => {
        const s = new Date(startDate + 'T00:00:00');
        s.setDate(s.getDate() + d * 3);
        setStartDate(fmt(s));
        const e = new Date(s);
        e.setDate(s.getDate() + 2);
        setEndDate(fmt(e));
    };
    const visibleTours = useMemo(() =>
        selectedClass ? data.tours.filter(t => t.classes_id === parseInt(selectedClass)) : data.tours,
    [selectedClass, data.tours]);

    const filteredBoats = useMemo(() => {
        let boats = data.boats;
        if (selectedClass) {
            const ids = new Set(data.tours.filter(t => t.classes_id === parseInt(selectedClass)).flatMap(t => t.boat_ids));
            boats = boats.filter(b => ids.has(b.id));
        }
        if (selectedTour) {
            const tour = data.tours.find(t => t.id === parseInt(selectedTour));
            if (tour) boats = boats.filter(b => tour.boat_ids.includes(b.id));
        }
        return boats;
    }, [selectedClass, selectedTour, data]);

    const handleCellClick = (boat, date, records) => {
        if (!records.length) {
            if (confirm(`Block ${boat.name} on ${date}?`)) saveItem({ boat_id: boat.id, date, type: 3 });
        } else {
            setEditItem({ ...records[0], boatName: boat.name, allRecords: records });
        }
    };

    const calendarHeaders = () => ({
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem(TOKEN_KEY) || ''}`,
    });

    const saveItem = async item => {
        setLoading(true);
        try {
            const url = item.id
                ? `https://bluuu.tours/api/new/calendar/update/${item.id}`
                : `https://bluuu.tours/api/new/calendar/create`;
            const res = await fetch(url, { method: 'POST', headers: calendarHeaders(), body: JSON.stringify(item) });
            if (res.ok) { await fetchData(); setEditItem(null); }
        } catch (e) { alert('Failed'); }
        setLoading(false);
    };

    const deleteItem = async id => {
        if (!confirm('Delete?')) return;
        setLoading(true);
        try {
            const res = await fetch(`https://bluuu.tours/api/new/calendar/delete/${id}`, { method: 'POST', headers: calendarHeaders(), body: JSON.stringify({}) });
            if (res.ok) { await fetchData(); setEditItem(null); }
        } catch (e) { alert('Failed'); }
        setLoading(false);
    };

    const selectClass = cls => { setSelectedClass(cls); setSelectedTour(''); };
    const btnCls = (active, color) => `h-9 px-4 flex items-center rounded-lg text-sm font-bold uppercase tracking-wider transition-all border shadow-sm ${active ? color : 'bg-white border-slate-200 text-slate-500 hover:text-slate-800 hover:border-slate-300'}`;

    if (loading && !data.boats.length) return (
        <div className="flex justify-center mt-24 text-blue-500 font-bold animate-pulse tracking-[0.2em] text-sm">LOADING...</div>
    );

    return (
        <div>
            <div className="sticky top-0 z-20 bg-slate-100 -mx-4 md:-mx-6 px-4 md:px-6 pt-1 pb-3 mb-5 shadow-[0_3px_10px_rgba(0,0,0,0.07)] overflow-x-auto">
                <DateRangeBar
                    menu={<MenuButton tabs={tabs} activeTab={activeTab} setActiveTab={setActiveTab} onLogout={onLogout} />}
                    dateFrom={startDate} dateTo={endDate}
                    onFrom={v => { setStartDate(v); const mx = new Date(v+'T00:00:00'); mx.setDate(mx.getDate()+2); if (endDate > fmt(mx)) setEndDate(fmt(mx)); if (v > endDate) setEndDate(v); }}
                    onTo={v => { setEndDate(v); const mn = new Date(v+'T00:00:00'); mn.setDate(mn.getDate()-2); if (startDate < fmt(mn)) setStartDate(fmt(mn)); if (v < startDate) setStartDate(v); }}
                    navPrev={() => shiftRange(-1)} navNext={() => shiftRange(1)}
                    loading={loading}
                    trailing={
                        <>
                            <button onClick={() => selectClass('')}  className={btnCls(selectedClass === '',  'bg-slate-800 border-slate-700 text-white')}>All</button>
                            <button onClick={() => selectClass('8')} className={btnCls(selectedClass === '8', 'bg-violet-600 border-violet-500 text-white')}>Private</button>
                            <button onClick={() => selectClass('9')} className={btnCls(selectedClass === '9', 'bg-blue-600 border-blue-500 text-white')}>Shared</button>
                            <select value={selectedTour} onChange={e => setSelectedTour(e.target.value)} className={SELECT + ' min-w-[160px]'}>
                                <option value="">All Tours</option>
                                {visibleTours.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                            </select>
                            <span className="text-[10px] text-slate-400 uppercase tracking-widest">{filteredBoats.length} boats · {days.length} days</span>
                        </>
                    }
                />
            </div>

            {/* Grid */}
            <div className={`${GLASS} overflow-hidden`}>
                <div className="overflow-x-auto">
                    <div style={{ display: 'grid', gridTemplateColumns: `190px repeat(${days.length}, minmax(44px, 1fr))`, gap: '1px', background: '#e2e8f0' }}>
                        <div className="sticky left-0 z-10 bg-slate-50 flex flex-col justify-center items-start px-3 py-2 text-md font-bold text-slate-400 uppercase tracking-tighter border-b border-slate-200 min-h-[44px]">Boat / Date</div>
                        {days.map(d => {
                            const [, mm, dd] = d.split('-');
                            const isToday = d === todayBali();
                            return (
                                <div key={d} className={`flex flex-col justify-center items-center text-md font-bold border-b border-slate-200 min-h-[44px] min-w-[44px] ${isToday ? 'text-blue-600 bg-blue-50' : 'text-slate-500 bg-slate-50'}`}>
                                    <span>{dd}</span><span className="opacity-50">{mm}</span>
                                </div>
                            );
                        })}
                        {filteredBoats.map(boat => (
                            <React.Fragment key={boat.id}>
                                <div className="sticky left-0 z-10 bg-white flex flex-col justify-center px-3 py-2 border-t border-slate-200 min-h-[44px] min-w-[190px] max-w-[190px] cursor-default">
                                    <div className="truncate text-sm text-slate-700 font-semibold">{boat.name}</div>
                                    <div className="text-[10px] text-slate-400 uppercase tracking-widest">cap {boat.capacity}</div>
                                </div>
                                {days.map(d => {
                                    const records = boat.closed_dates.filter(c => c.date === d);
                                    const primary = records[0];
                                    const pax     = primary?.type === 1 ? records.reduce((s, r) => s + (Number(r.qtty) || 0), 0) : null;
                                    const full    = pax !== null && boat.capacity && pax >= boat.capacity;
                                    const sc      = records.length === 0 ? 'bg-emerald-400 text-white hover:bg-emerald-500' : (full ? 'bg-orange-500 text-white' : statusCls(primary?.type));
                                    const lbl     = records.length === 0 ? 'OPEN' : statusLabel(primary?.type, records, boat.capacity);
                                    return (
                                        <div key={d} onClick={() => handleCellClick(boat, d, records)}

            .then(r => r.json())
            .then(json => setLines(Array.isArray(json.odoo?.lines) ? json.odoo.lines : []))

// ─── LanyardColorPicker ───────────────────────────────────────────────────────
function LanyardColorPicker({ value, onChange }) {
    const [open, setOpen] = useState(false);
    const [pos,  setPos]  = useState({ top: 0, left: 0 });
    const btnRef  = useRef(null);
    const dropRef = useRef(null);

    useEffect(() => {
        if (!open) return;
        const handler = e => {
            if (btnRef.current?.contains(e.target) || dropRef.current?.contains(e.target)) return;
            setOpen(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
    }, [open]);

    const toggle = e => {
        e.stopPropagation();
        if (!open && btnRef.current) {
            const r = btnRef.current.getBoundingClientRect();
            setPos({ top: r.bottom + 4, left: r.left });
        }
        setOpen(o => !o);
    };

    const info = lanyardColorInfo(value);
    const dotStyle = info
        ? { background: info.color, border: info.border ? `1.5px solid ${info.border}` : '2px solid transparent' }
        : { background: '#f1f5f9', border: '1.5px dashed #cbd5e1' };

    return (
        <div onClick={e => e.stopPropagation()}>
            <button ref={btnRef} onClick={toggle} title={value || 'Set lanyard color'}
                className="w-6 h-6 rounded-full flex-shrink-0 transition-transform hover:scale-110"
                style={dotStyle} />
            {open && ReactDOM.createPortal(
                <div ref={dropRef} onClick={e => e.stopPropagation()}
                    style={{ position: 'fixed', top: pos.top, left: pos.left, zIndex: 9999 }}
                    className="bg-white border border-slate-200 rounded-xl shadow-xl p-2">
                    <div className="grid grid-cols-7 gap-1">
                        {LANYARD_COLORS.map(c => (
                            <button key={c.value} title={c.value}
                                onClick={() => { onChange(c.value); setOpen(false); }}
                                style={{
                                    background: c.color,
                                    border: c.value === value ? '2px solid #0f172a' : (c.border ? `1.5px solid ${c.border}` : '2px solid transparent'),
                                }}
                                className="w-6 h-6 rounded-full transition-transform hover:scale-125" />
                        ))}
                        <button title="Clear" onClick={() => { onChange(false); setOpen(false); }}
                            className="w-6 h-6 rounded-full bg-slate-100 border border-dashed border-slate-300 text-slate-400 text-[10px] font-bold flex items-center justify-center hover:bg-red-50 hover:border-red-200 hover:text-red-400 transition-colors">
                            ×
                        </button>
                    </div>
                    {value && <div className="text-[10px] text-slate-500 text-center mt-1.5">{value}</div>}
                </div>,
                document.body
            )}
        </div>
    );
}

// ─── LeadsTable ───────────────────────────────────────────────────────────────
function LeadsTable({ orders, onRow, updateOrder }) {
    const [checkPayDialog, setCheckPayDialog] = useState(null);
    const [saving,         setSaving]         = useState(false);
    const [sort, setSort] = useState({ key: null, dir: 'asc' });

    const currentManager = localStorage.getItem(MANAGER_KEY) || '';

    const toggleSort = key => setSort(prev =>
        prev.key === key ? { key, dir: prev.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' }
    );

    const sortedOrders = useMemo(() => {
        if (!sort.key) return orders;
        return [...orders].sort((a, b) => {
            let av = a[sort.key], bv = b[sort.key];
            if (sort.key === 'partner_id') {
                av = Array.isArray(av) ? av[1] : av;
                bv = Array.isArray(bv) ? bv[1] : bv;
            }
            if (av === false || av == null) av = '';
            if (bv === false || bv == null) bv = '';
            const cmp = (typeof av === 'number' && typeof bv === 'number')
                ? av - bv : String(av).localeCompare(String(bv));
            return sort.dir === 'asc' ? cmp : -cmp;
        });
    }, [orders, sort]);

    const SI = ({ k }) => sort.key === k ? (sort.dir === 'asc' ? ' ^' : ' v') : '';

    const openCheckPay = (e, o) => {
        e.stopPropagation();
        const existingBy = (o.x_studio_checked_in_by && o.x_studio_checked_in_by !== false)
            ? String(o.x_studio_checked_in_by) : '';
        setCheckPayDialog({
            orderId:    o.id,
            clientName: partnerName(o),
            checkedIn:  !!o.x_studio_customer_checked_in_and_cleared,
            noShow:     !!o.x_studio_no_show_1,
            checkedBy:  existingBy || currentManager,
            collect:    Number(o.x_studio_collect ?? 0),
            cash:       Number(o.x_studio_collected_by_cash ?? 0),
            edc:        Number(o.x_studio_collected_by_edcbank ?? 0),
            payMethod:  null,
            payAmount:  '',
        });
    };

    const saveCheckPay = async () => {
        setSaving(true);
        const d = checkPayDialog;
        const fields = {
            x_studio_customer_checked_in_and_cleared: d.checkedIn,
            x_studio_checked_in_by: d.checkedIn ? (d.checkedBy || false) : false,
            x_studio_no_show_1: d.noShow,

        if (d.payMethod && d.payAmount !== '') {
            const amt = parseFloat(d.payAmount) || 0;

            else                        fields.x_studio_collected_by_edcbank = amt;

            await updateOrder(d.orderId, fields);

        <div className="overflow-x-auto overflow-y-auto" style={{ maxHeight: 'calc(100vh - 180px)' }}>
            {/* Header */}
            <div className="flex gap-0 bg-slate-50 border-b-2 border-slate-200 sticky top-0 z-10 min-w-max">
                <div className="w-1 shrink-0" />
                <div className="flex items-center gap-4 px-4 py-2">
                    {[
                        { label: 'Date',        key: 'rental_start_date',                       w: 84  },
                        { label: 'Client',      key: 'partner_id',                              w: 140 },
                        { label: 'Pax',         key: 'x_studio_count_of_people',                w: 50  },
                        { label: 'Lanyard',     key: null,                                      w: 48  },
                        { label: 'Boat',        key: 'x_studio_boat_name',                      w: 160 },
                        { label: 'Type',        key: 'x_studio_tour_type',                      w: 130 },
                        { label: 'Guides',      key: null,                                      w: 110 },
                        { label: 'Lunch',       key: 'x_studio_lunch',                          w: 120 },
                        { label: 'Transfer',    key: 'x_studio_car_type',                       w: 130 },
                        { label: 'Special Req', key: null,                                      w: 180 },
                        { label: 'Finance',     key: 'amount_total',              align: 'right', w: 130},
                        { label: 'Check In',    key: 'x_studio_customer_checked_in_and_cleared', w: 260},
                        { label: 'Products',    key: null,                                      w: 220 },
                    ].map(col => (
                        <div
